<!-- =============================================================
     EPIC E2 — CONTINUED
     Commodity & Forex (auto-recalc on approval) · Change Requests
     (content-based approval + Approval Notes) · EBON / Purchase
     Orders + annual reminder · Imported Parts (Block→Actual at SOP)
     · BOM at SOP · Material-Cost / Investment / Benchmarking
     dashboards with a Forecast toggle and context AI panel.

     Pure EXTENSION: reuses the existing Components, Store, Drawer,
     Toast, RBAC, Router, NAV, DATA and effective-date resolver, and
     registers new builders into SCREENS{}. Nothing above is edited.
============================================================= -->
<script>
(function(){

/* ---------------------------------------------------------
   NEW DATA COLLECTIONS
--------------------------------------------------------- */
DATA.commodityApprovals = [];   // commodity / FX change requests awaiting approval
DATA.changeRequests     = [];   // governed, numbered change requests
DATA.approvalNotes      = [];    // generated approval notes + rejection log
DATA.ebonPOs            = [];    // purchase-order lines tracked from EBON
DATA.importedParts      = [];    // block (provisional) → actual at SOP
DATA.bomSop             = [];    // BOM at SOP lines (applicability per model)
DATA.benchmarks         = [];    // uploaded external reference projects

/* ---------------------------------------------------------
   LOCAL HELPERS (mirror the CBD math so this scope is
   self-contained; they operate on the SAME global DATA.cbds
   objects the earlier screens render, so a recalc here is
   immediately visible on the CBD tree & price history).
--------------------------------------------------------- */
const COMMODITY_OF = {Steel:"C1", Aluminium:"C2", Copper:"C3", Lead:"C4", Precious:"C5"};
const BUCKET_OF    = {C1:"steel", C2:"aluminium", C3:"copper", C4:"lead", C5:"precious"};

function fmt(n){ return (Math.round((+n||0)*100)/100).toLocaleString("en-IN"); }
function partByNumber(no){ return DATA.parts.find(p=>p.number===no); }
function projectBrand(code){ const p=DATA.projects.find(x=>x.code===code || (code&&code.startsWith(x.code))); return p?p.brand:"\u2014"; }
function commodityPrice(name){ const id=COMMODITY_OF[name]; const rec=id&&DATA.commodities.find(c=>c.id===id); return rec?(Store.currentValue(rec)||0):0; }
function rawMaterialValue(cbd){ const w=cbd.weights;
  return (w.steel.net*commodityPrice("Steel"))+(w.aluminium.net*commodityPrice("Aluminium"))
       +(w.copper.net*commodityPrice("Copper"))+(w.lead.net*commodityPrice("Lead"))+(w.precious.net*commodityPrice("Precious")); }
function importValue(cbd){ return (cbd.importContent.value||0)*(cbd.importContent.fxRate||0); }
function manualNodesTotal(cbd){ return cbd.tree.filter(n=>!n.derived).reduce((s,n)=>s+(+n.cost||0),0); }
function cbdPartCost(cbd){ return rawMaterialValue(cbd)+importValue(cbd)+manualNodesTotal(cbd); }
function cbdCarCost(cbd){ return cbdPartCost(cbd)*(cbd.qtyPerCar||1)+(cbd.dd.amortPerCar||0); }
function syncDerivedNodes(cbd){
  cbd.tree = cbd.tree.filter(n=>!n.derived);
  cbd.tree.unshift(
    {id:"D-RAW", derived:true, level:0, name:"Raw material (from weights \u00D7 commodity price)", cost:rawMaterialValue(cbd)},
    {id:"D-IMP", derived:true, level:0, name:"Import content (value \u00D7 FX)", cost:importValue(cbd)}
  );
}
function weightNet(cbd, bucket){ return (cbd.weights[bucket] && cbd.weights[bucket].net) || 0; }
function pushPriceVersion(partNumber, price, source, changeReq){
  const list = DATA.priceVersions[partNumber] || (DATA.priceVersions[partNumber]=[]);
  const last = list[list.length-1] || {vsi:0,target:0};
  list.push({price:Math.round(price), vsi:last.vsi, target:last.target, effectiveFrom:TODAY, source, changeReq:changeReq||null});
}
function volumeForProject(code){ const v=DATA.carVolumes.find(x=>x.project===code); return v?v.volume:40000; }

/* Next workflow number per prefix */
const WF_SEQ = {CMD:40, FX:60, CR:100, PO:200, IMP:300, BOM:400};
function nextWf(prefix){ WF_SEQ[prefix]=(WF_SEQ[prefix]||0)+1; return `${prefix}-2026-${String(WF_SEQ[prefix]).padStart(4,"0")}`; }

/* ---------------------------------------------------------
   SHARED COMPONENT: APPROVAL TIMELINE (content-based)
   steps: [{label, who, status:'done'|'current'|'pending', when}]
--------------------------------------------------------- */
Components.approvalTimeline = function(steps){
  const el = document.createElement("div");
  el.innerHTML = `<ul class="timeline">${steps.map(s=>`
    <li class="${s.status==='done'?'done':s.status==='current'?'current':''}">
      <div class="tl-dot">${s.status==='done'?'\u2713':s.status==='current'?'\u25CF':(s.idx||'')}</div>
      <div class="tl-body">
        <div class="tl-title">${s.label}${s.status==='current'?' <span class="chip chip-blue" style="margin-left:6px;"><span class="chip-dot"></span>awaiting</span>':''}${s.status==='done'?' <span class="chip chip-green" style="margin-left:6px;"><span class="chip-dot"></span>cleared</span>':''}</div>
        <div class="tl-meta">${s.who||""}${s.when?` \u2022 ${s.when}`:""}</div>
      </div></li>`).join("")}</ul>`;
  return el;
};
/* Build the content-based chain for a given kind + high-value flag */
function approvalChain(originLabel, highValue, currentStage, done){
  const steps = [
    {label:"Initiated / submitted", who:originLabel},
    {label:"Approver review", who:DATA.users.find(u=>u.role==="approver").name+" (Approver)"},
  ];
  if(highValue) steps.push({label:"Management sign-off", who:"Head of Procurement \u2014 required for high value / business share"});
  steps.push({label:"Applied & note circulated", who:"System \u2014 records updated, Approval Note issued"});
  // mark statuses
  return steps.map((s,i)=>{
    let status = "pending";
    if(i < done) status = "done";
    else if(i === done) status = "current";
    return {...s, idx:i+1, status};
  });
}

/* =============================================================
   COMMODITY & FOREX  (auto-recalculation on approval)
============================================================= */
let CF_TAB = "prices"; // prices | approvals | risk

/* Apply an APPROVED commodity/FX change and recalc dependent CBDs */
function applyCommodityApproval(ap){
  let touched = [];
  if(ap.kind==="commodity"){
    const rec = DATA.commodities.find(c=>c.id===ap.targetId);
    rec.history.push({effectiveFrom:ap.effectiveFrom, value:ap.newValue, source:ap.source+" (approved)"});
    rec.history.sort((a,b)=> new Date(a.effectiveFrom)-new Date(b.effectiveFrom));
    Store.touch(rec);
    const bucket = BUCKET_OF[rec.id];
    Object.values(DATA.cbds).forEach(cbd=>{
      if(bucket && weightNet(cbd,bucket)>0){
        syncDerivedNodes(cbd); Store.touch(cbd);
        pushPriceVersion(cbd.partNumber, cbdPartCost(cbd), `Commodity recalculation \u2014 ${rec.name}`, ap.wf);
        touched.push(cbd.part);
      }
    });
  } else { // fx
    const rec = DATA.fx.find(f=>f.id===ap.targetId);
    rec.history.push({effectiveFrom:ap.effectiveFrom, value:ap.newValue, source:ap.source+" (approved)"});
    rec.history.sort((a,b)=> new Date(a.effectiveFrom)-new Date(b.effectiveFrom));
    Store.touch(rec);
    Object.values(DATA.cbds).forEach(cbd=>{
      if(cbd.importContent.currency===rec.currency && (cbd.importContent.value||0)>0){
        cbd.importContent.fxRate = ap.newValue;
        syncDerivedNodes(cbd); Store.touch(cbd);
        pushPriceVersion(cbd.partNumber, cbdPartCost(cbd), `Forex recalculation \u2014 ${rec.currency}`, ap.wf);
        touched.push(cbd.part);
      }
    });
  }
  ap.status="Approved"; ap.stage="Applied"; ap.recalculated=touched;
  Store.audit(ap.kind==="commodity"?"Commodity":"Exchange Rate", "approved + auto-recalc", `${ap.label} \u2192 ${ap.newValue} \u2022 ${touched.length} CBD(s)`);
  Toast.show(`${ap.label} approved. ${touched.length} dependent CBD(s) recalculated & dashboards refreshed.`, "success");
}

function buildCommodityForex(){
  const wrap = document.createElement("div");
  const canApprove = RBAC.role==="approver" || RBAC.role==="admin";
  const canSubmit  = RBAC.role==="commodity" || RBAC.role==="pm" || RBAC.role==="admin" || RBAC.canWrite("commodity") || RBAC.canWrite("fx");
  wrap.appendChild(Components.pageHeader("Commodity & Forex",
    "Effective-dated commodity prices and FX rates. A change is submitted for approval; on approval the system automatically re-rolls every dependent Cost Breakdown and refreshes the material-cost and risk figures."));

  // tab bar
  const tabs=[{id:"prices",label:"Prices & Rates"},{id:"approvals",label:"Approvals"},{id:"risk",label:"Commodity / Forex Risk"}];
  const tabBar=document.createElement("div");
  tabBar.style.cssText="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--gray-200);padding-bottom:2px;";
  tabs.forEach(t=>{
    const b=document.createElement("button"); b.className="btn btn-ghost";
    b.style.cssText="border-radius:8px 8px 0 0;font-weight:700;"+(t.id===CF_TAB?"background:var(--light);color:var(--blue);border-bottom:2px solid var(--blue);":"color:var(--gray-600);");
    b.textContent=t.label; b.onclick=()=>{CF_TAB=t.id;Router.render();};
    if(t.id==="approvals"){ const p=DATA.commodityApprovals.filter(a=>a.status==="Pending").length; if(p) b.innerHTML=t.label+` <span class="count-pill">${p}</span>`; }
    tabBar.appendChild(b);
  });
  wrap.appendChild(tabBar);

  if(CF_TAB==="prices") wrap.appendChild(cfPricesView(canSubmit));
  else if(CF_TAB==="approvals") wrap.appendChild(cfApprovalsView(canApprove));
  else wrap.appendChild(cfRiskView());
  return wrap;
}

function cfPricesView(canSubmit){
  const holder=document.createElement("div");
  const bar=document.createElement("div"); bar.style.cssText="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;";
  if(canSubmit){
    const b1=document.createElement("button"); b1.className="btn btn-primary"; b1.textContent="+ Submit commodity price change"; b1.onclick=()=>openCommodityChangeDrawer("commodity"); bar.appendChild(b1);
    const b2=document.createElement("button"); b2.className="btn"; b2.textContent="+ Submit FX rate change"; b2.onclick=()=>openCommodityChangeDrawer("fx"); bar.appendChild(b2);
  } else {
    bar.appendChild(Components.el(`<span class="chip chip-amber"><span class="chip-dot"></span>Read-only \u2014 switch to Commodity Mgr / PM to submit</span>`));
  }
  holder.appendChild(bar);

  const grid=document.createElement("div"); grid.className="grid grid-2";
  // commodities
  const cPanel=document.createElement("div"); cPanel.className="panel";
  cPanel.appendChild(Components.masterTable({
    columns:[
      {key:"name",label:"Commodity",render:r=>`${r.code==="STEEL-HRC"?'\u{1F535} ':''}<b>${r.name}</b>`},
      {key:"__cur",label:"Current",render:r=>`\u20B9${fmt(Store.currentValue(r))} <span class="text-muted">${r.uom}</span>`},
      {key:"__mv",label:"Last move",render:r=>{const h=r.history;if(h.length<2)return "\u2014";const d=(h[h.length-1].value-h[h.length-2].value)/h[h.length-2].value*100;return `<span class="chip ${d>0?'chip-red':'chip-green'}"><span class="chip-dot"></span>${d>=0?'+':''}${d.toFixed(1)}%</span>`;}},
      {key:"__v",label:"Versions",render:r=>`<span class="chip chip-gray"><span class="chip-dot"></span>${r.history.length}</span>`},
    ], rows:DATA.commodities, emptyText:"No commodities."
  }));
  // wrap header
  cPanel.insertBefore(Components.el(`<div class="panel-header"><h3>Commodity prices</h3><span class="count-pill">${DATA.commodities.length}</span></div>`), cPanel.firstChild);
  grid.appendChild(cPanel);

  const fPanel=document.createElement("div"); fPanel.className="panel";
  fPanel.appendChild(Components.masterTable({
    columns:[
      {key:"currency",label:"Currency",render:r=>`<b>${r.currency}</b>`},
      {key:"project",label:"Project"},
      {key:"__cur",label:"Current rate",render:r=>`\u20B9${fmt(Store.currentValue(r))}`},
      {key:"__v",label:"Versions",render:r=>`<span class="chip chip-gray"><span class="chip-dot"></span>${r.history.length}</span>`},
    ], rows:DATA.fx, emptyText:"No FX rates."
  }));
  fPanel.insertBefore(Components.el(`<div class="panel-header"><h3>Exchange rates</h3><span class="count-pill">${DATA.fx.length}</span></div>`), fPanel.firstChild);
  grid.appendChild(fPanel);
  holder.appendChild(grid);
  return holder;
}

function openCommodityChangeDrawer(kind){
  const isC = kind==="commodity";
  const list = isC?DATA.commodities:DATA.fx;
  const opts = list.map(r=>`<option value="${r.id}">${isC?r.name+" ("+r.code+")":r.currency+" \u2014 "+r.project}</option>`).join("");
  Drawer.open(isC?"Submit commodity price change":"Submit FX rate change",
    `<div class="form-row"><label>${isC?"Commodity":"Currency / project"}</label><select id="cc-target">${opts}</select></div>
     <div class="form-row"><label>New ${isC?"price":"rate"}</label><input id="cc-val" type="number" step="0.01" placeholder="e.g. 72.5"></div>
     <div class="form-row"><label>Effective from</label><input id="cc-eff" type="date" value="${TODAY}"></div>
     <div class="form-row"><label>Source</label><input id="cc-src" value="${isC?'Index':'Treasury'}"></div>
     <div class="hint">Submitting routes the change through the approval timeline. Dependent CBDs are recalculated only <b>after approval</b>.</div>`,
    ()=>{
      const id=document.getElementById("cc-target").value;
      const rec=list.find(r=>r.id===id);
      const newVal=parseFloat(document.getElementById("cc-val").value);
      if(isNaN(newVal)){ Toast.show("Enter a valid value.","warn"); return; }
      const oldVal=Store.currentValue(rec)||0;
      const movePct = oldVal? Math.abs((newVal-oldVal)/oldVal*100):0;
      const highValue = movePct>=5;
      const wf=nextWf(isC?"CMD":"FX");
      const label = isC? rec.name : (rec.currency+" \u2014 "+rec.project);
      const ap={id:"AP"+(DATA.commodityApprovals.length+1), wf, kind, targetId:id, label,
        oldValue:oldVal, newValue:newVal, movePct, effectiveFrom:document.getElementById("cc-eff").value||TODAY,
        source:document.getElementById("cc-src").value||"Manual", status:"Pending", stage:"Approver review",
        highValue, done:1, submittedBy:DATA.users.find(u=>u.role===RBAC.role)?.name||"User"};
      DATA.commodityApprovals.unshift(ap);
      DATA.tasks.unshift({icon:"\u2705", title:`Approve ${isC?'commodity':'FX'} change \u2014 ${label}`, meta:`Commodity & Forex \u2022 ${newVal} eff ${ap.effectiveFrom}`, role:"approver", due:"Due today", wf});
      Notif.updateBadge();
      Store.audit(isC?"Commodity":"Exchange Rate","change submitted for approval",`${label} \u2192 ${newVal} (${wf})`);
      CF_TAB="approvals";
      setTimeout(()=>Router.render(),40);
      Toast.show(`Change ${wf} submitted${highValue?" \u2014 high move, routed via Management":""}.`,"success");
    });
}

function cfApprovalsView(canApprove){
  const holder=document.createElement("div");
  if(DATA.commodityApprovals.length===0){
    holder.appendChild(Components.el(`<div class="coming-soon"><div class="cs-icon">\u{1F4C4}</div><div class="cs-title">No commodity / FX changes yet</div><div class="text-muted">Submit a change from the Prices & Rates tab to start an approval.</div></div>`));
    return holder;
  }
  DATA.commodityApprovals.forEach(ap=>{
    const p=document.createElement("div"); p.className="panel"; p.style.marginBottom="14px";
    const chip = ap.status==="Approved"?Components.chip("Approved"):ap.status==="Rejected"?Components.chip("Rejected"):Components.chip("Pending");
    p.innerHTML=`<div class="panel-header">
        <h3>${ap.kind==="commodity"&&ap.label.toLowerCase().includes("steel")?'\u{1F535} ':''}${ap.label} ${Components.wfChip(ap.wf)}</h3>
        <span>${chip}</span></div>`;
    const body=document.createElement("div"); body.className="panel-body";
    const grid=document.createElement("div"); grid.className="grid grid-2";
    const info=document.createElement("div");
    const move=(ap.newValue-ap.oldValue), movePct=ap.movePct||0;
    info.innerHTML=`
      ${[["Type",ap.kind==="commodity"?"Commodity price":"FX rate"],
         ["Current",fmt(ap.oldValue)],["Proposed",`<b>${fmt(ap.newValue)}</b>`],
         ["Move",`<span class="chip ${move>0?'chip-red':'chip-green'}"><span class="chip-dot"></span>${move>=0?'+':''}${fmt(move)} (${movePct.toFixed(1)}%)</span>`],
         ["Effective from",ap.effectiveFrom],["Source",ap.source],
         ["Routing",ap.highValue?'Approver \u2192 Management (high move)':'Approver'],
         ["Submitted by",ap.submittedBy]]
        .map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--gray-100);"><span class="text-muted">${k}</span><span>${v}</span></div>`).join("")}`;
    grid.appendChild(info);
    const tl=document.createElement("div");
    const done = ap.status==="Approved"? 99 : ap.status==="Rejected"? ap.done : ap.done;
    tl.appendChild(Components.el(`<div class="text-muted" style="font-size:12px;margin-bottom:8px;">Approval timeline</div>`));
    tl.appendChild(Components.approvalTimeline(approvalChain(ap.submittedBy+" (submitter)", ap.highValue, ap.status==="Approved"?99:ap.done, )));
    grid.appendChild(tl);
    body.appendChild(grid);

    if(ap.status==="Approved" && ap.recalculated && ap.recalculated.length){
      body.appendChild(Components.el(`<div class="panel" style="border-left:4px solid var(--green);margin-top:12px;"><div class="panel-body" style="display:flex;gap:10px;align-items:center;"><span style="font-size:18px;">\u{1F504}</span><div><b>Auto-recalculated:</b> <span class="text-muted">${ap.recalculated.join(", ")} \u2014 material cost & risk figures refreshed.</span></div></div></div>`));
    }
    if(ap.status==="Pending"){
      const act=document.createElement("div"); act.style.cssText="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;";
      if(canApprove){
        const nextLabel = (ap.highValue && ap.done===1) ? "Approve (Approver \u2192 send to Management)" : "Approve";
        const ap2=document.createElement("button"); ap2.className="btn btn-primary"; ap2.textContent=nextLabel;
        ap2.onclick=()=>{
          if(ap.highValue && ap.done===1){ ap.done=2; ap.stage="Management sign-off";
            Store.audit("Approval","approver cleared \u2192 management",ap.wf); Toast.show("Approver cleared. Escalated to Management sign-off.","info");
            Router.render(); return; }
          applyCommodityApproval(ap); Notif.updateBadge(); Router.render();
        };
        const rj=document.createElement("button"); rj.className="btn"; rj.textContent="Reject";
        rj.onclick=()=>{ ap.status="Rejected"; ap.stage="Rejected";
          DATA.approvalNotes.unshift({when:new Date().toISOString().slice(0,16).replace("T"," "), kind:"Rejection", ref:ap.wf, text:`${ap.label} change to ${ap.newValue} rejected by ${DATA.users.find(u=>u.role==="approver").name}.`});
          Store.audit("Approval","rejected",ap.wf); Toast.show("Change rejected and logged.","warn"); Router.render(); };
        act.appendChild(rj); act.appendChild(ap2);
      } else {
        act.appendChild(Components.el(`<span class="chip chip-amber"><span class="chip-dot"></span>Awaiting Approver \u2014 switch role to act</span>`));
      }
      body.appendChild(act);
    }
    p.appendChild(body);
    holder.appendChild(p);
  });
  return holder;
}

function cfRiskView(){
  const holder=document.createElement("div");
  holder.appendChild(Components.el(`<div class="text-muted" style="font-size:12.5px;margin-bottom:14px;">Exposure = current material value of dependent parts \u00D7 planned car volume. Projected impact assumes a <b>+5%</b> commodity / FX move. Steel is highlighted as the dominant exposure.</div>`));

  DATA.projects.forEach(pr=>{
    const cbds = Object.values(DATA.cbds).filter(c=>c.project===pr.code);
    if(!cbds.length) return;
    const vol = volumeForProject(pr.code);
    const buckets = [
      {name:"Steel", key:"steel", price:commodityPrice("Steel"), steel:true},
      {name:"Aluminium", key:"aluminium", price:commodityPrice("Aluminium")},
      {name:"Copper", key:"copper", price:commodityPrice("Copper")},
      {name:"Import / FX", key:"__fx", price:null},
    ];
    const rows = buckets.map(b=>{
      let exposure=0;
      cbds.forEach(c=>{
        if(b.key==="__fx") exposure += importValue(c)*(c.qtyPerCar||1);
        else exposure += weightNet(c,b.key)*(b.price||0)*(c.qtyPerCar||1);
      });
      exposure = exposure*vol/100000; // scale to a readable "per 100k cars" figure
      return {...b, exposure, impact:exposure*0.05};
    });
    const totalExp = rows.reduce((s,r)=>s+r.exposure,0)||1;

    const panel=document.createElement("div"); panel.className="panel"; panel.style.marginBottom="14px";
    panel.innerHTML=`<div class="panel-header"><h3>${pr.code} <span class="text-muted" style="font-weight:500;font-size:12px;">\u2022 ${pr.brand} \u2022 vol ${fmt(vol)}</span></h3>
      <span class="chip chip-blue"><span class="chip-dot"></span>${cbds.length} part(s)</span></div>`;
    const body=document.createElement("div"); body.className="panel-body";
    body.innerHTML = rows.map(r=>{
      const pct=Math.round(r.exposure/totalExp*100);
      const color=r.steel?"var(--red)":r.key==="__fx"?"var(--blue)":"var(--gray-400)";
      return `<div style="margin-bottom:12px;${r.steel?'background:#FBEAE8;border-radius:8px;padding:8px 10px;':''}">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
          <span style="font-weight:${r.steel?'800':'600'};color:${r.steel?'var(--red)':'var(--gray-800)'};">${r.steel?'\u{1F535} ':''}${r.name}${r.steel?' \u2014 key exposure':''}</span>
          <span>exposure <b>\u20B9${fmt(r.exposure)}</b> \u2022 +5% impact <b style="color:var(--red);">\u20B9${fmt(r.impact)}</b></span></div>
        <div style="height:10px;background:var(--gray-100);border-radius:6px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${color};"></div></div>
      </div>`;
    }).join("");
    panel.appendChild(body);
    holder.appendChild(panel);
  });
  if(!holder.querySelector(".panel")){
    holder.appendChild(Components.el(`<div class="coming-soon"><div class="cs-icon">\u{1F4CA}</div><div class="cs-title">No CBDs to assess yet</div><div class="text-muted">Build cost breakdowns to populate the commodity/forex risk panel.</div></div>`));
  }
  return holder;
}

  DATA.approvalNotes.unshift({when:new Date().toISOString().slice(0,16).replace("T"," "), kind:"Approval Note", ref:cr.wf,

}

function applyCR(cr){
  // update records
  if(cr.type==="price" && cr.partNumber){
    pushPriceVersion(cr.partNumber, cr.newValue, `Change request approved`, cr.wf);
    const cbd=DATA.cbds[cr.partNumber]; if(cbd){ syncDerivedNodes(cbd); Store.touch(cbd); }
  }
  if(cr.type==="business-share"){ /* would update supplier.businessShare in full build */ }
  cr.status="Approved"; cr.done=99;
  issueApprovalNote(cr);
  Store.audit("Change Request","approved + note issued",cr.wf);
  Toast.show(`${cr.wf} approved. Record updated${cr.forcesCbd?" (CBD re-rolled)":""}; Approval Note emailed.`,"success");
}

    ["Documents",cr.docs.join(", ")],["Routing",cr.highValue?"Approver \u2192 Management":"Approver"],
    ["Circulation",cr.circulation.join(", ")],["Initiated by",cr.initiatedBy]];
  const body=`<div>${info.map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100);gap:12px;"><span class="text-muted">${k}</span><b style="text-align:right;">${v}</b></div>`).join("")}</div>

function openPromoteDrawer(ip){
  Drawer.open("Promote to actual at SOP",
    `<div class="text-muted" style="font-size:12.5px;margin-bottom:12px;">Replaces dummy <b>${ip.dummyNo}</b> (block ${fmt(ip.block)} ${ip.currency}) with the actual part number & price, then re-rolls the cost.</div>
     <div class="form-row"><label>Actual part no.</label><input id="pr-no" placeholder="e.g. 8W0-812345"></div>
     <div class="form-row"><label>Actual price (\u20B9)</label><input id="pr-price" type="number" step="0.01"></div>`,
    ()=>{
      const no=document.getElementById("pr-no").value||("8W0-"+(890000+DATA.importedParts.length));
      const price=parseFloat(document.getElementById("pr-price").value)||Math.round(ip.block*91.4);
      ip.actualNo=no; ip.actualPrice=price; ip.provisional=false;
      // create a part + CBD + price version so the cost is re-rolled into the platform
      if(!partByNumber(no)){
        DATA.parts.push({id:"PT-IMP"+DATA.importedParts.length, number:no, designation:ip.designation, project:ip.project,
          supplier:"Imported", status:"Fresh", type:"Single part", commodity:"Polymer", uoQ:"PCE", lastUpdated:TODAY});
      }
      pushPriceVersion(no, price, "Import block \u2192 actual at SOP", null);
      Store.audit("Imported Part","promoted to actual at SOP",`${ip.dummyNo} \u2192 ${no}`);
      Toast.show(`Promoted at SOP: ${no} @ \u20B9${fmt(price)} \u2014 cost re-rolled.`,"success");
      setTimeout(()=>Router.render(),40);
    });
}

/* =============================================================
   MATERIAL-COST DASHBOARD  (cost walk, brand-aware,
   Procurement / Finance views, Forecast toggle, AI panel)
============================================================= */
let MCD_VIEW="procurement";     // procurement | finance
let MCD_BRAND="all";
let MCD_LEVEL="part";           // part | car
let MCD_FC={commodity:false, forex:false, savings:false};

function forecastFactor(){
  let f=1;
  if(MCD_FC.commodity) f*=1.05;   // +5% commodity
  if(MCD_FC.forex)     f*=1.03;   // +3% forex
  if(MCD_FC.savings)   f*=0.98;   // -2% negotiated savings
  return f;
}

function buildMaterialCostDash(){
  const wrap=document.createElement("div");
  wrap.appendChild(Components.pageHeader("Material Cost",
    "Live cost walk from Budget to Forecast at part and car level, brand-aware, with separate Procurement and Finance views. Toggle commodity / forex / savings projections \u2014 steel is highlighted."));

  // controls
  const bar=document.createElement("div"); bar.style.cssText="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;";
  const viewSeg=Components.el(`<div id="module-switcher" style="background:var(--gray-100);">
     <button class="${MCD_VIEW==='procurement'?'active':''}" data-v="procurement" style="${MCD_VIEW==='procurement'?'background:#fff;color:var(--navy);':'color:var(--gray-600);'}">Procurement view</button>
     <button class="${MCD_VIEW==='finance'?'active':''}" data-v="finance" style="${MCD_VIEW==='finance'?'background:#fff;color:var(--navy);':'color:var(--gray-600);'}">Finance view</button></div>`);
  viewSeg.addEventListener("click",e=>{const b=e.target.closest("[data-v]"); if(b){MCD_VIEW=b.dataset.v;Router.render();}});
  bar.appendChild(viewSeg);
  const brands=["all",...new Set(DATA.projects.map(p=>p.brand))];
  const bsel=document.createElement("select"); bsel.style.cssText="padding:8px 10px;border:1px solid var(--gray-200);border-radius:8px;font-size:12.5px;background:#fff;";
  bsel.innerHTML=brands.map(b=>`<option value="${b}" ${MCD_BRAND===b?'selected':''}>${b==="all"?"All brands":b}</option>`).join("");
  bsel.onchange=()=>{MCD_BRAND=bsel.value;Router.render();}; bar.appendChild(bsel);
  const lsel=document.createElement("select"); lsel.style.cssText="padding:8px 10px;border:1px solid var(--gray-200);border-radius:8px;font-size:12.5px;background:#fff;";
  lsel.innerHTML=`<option value="part" ${MCD_LEVEL==='part'?'selected':''}>Part level</option><option value="car" ${MCD_LEVEL==='car'?'selected':''}>Car level</option>`;
  lsel.onchange=()=>{MCD_LEVEL=lsel.value;Router.render();}; bar.appendChild(lsel);
  const aiBtn=document.createElement("button"); aiBtn.className="btn"; aiBtn.style.marginLeft="auto"; aiBtn.textContent="\u2728 Ask AI about this view";
  aiBtn.onclick=()=>{AI.open();AI.ask("Material cost forecast and steel commodity risk");}; bar.appendChild(aiBtn);
  wrap.appendChild(bar);

  // forecast toggles
  const fc=document.createElement("div"); fc.style.cssText="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;";
  const mkToggle=(key,label,steel)=>{const on=MCD_FC[key];
    const b=document.createElement("button"); b.className="btn"+(on?" btn-primary":"");
    b.style.cssText=steel?(on?"background:var(--red);border-color:var(--red);":"border-color:var(--red);color:var(--red);"):"";
    b.textContent=(steel?"\u{1F535} ":"")+label+(on?" \u2713":"");
    b.onclick=()=>{MCD_FC[key]=!MCD_FC[key];Router.render();}; return b;};
  fc.appendChild(Components.el(`<span class="text-muted" style="font-size:12px;align-self:center;">Forecast:</span>`));
  fc.appendChild(mkToggle("commodity","Commodity +5%",true));
  fc.appendChild(mkToggle("forex","Forex +3%"));
  fc.appendChild(mkToggle("savings","Savings \u22122%"));
  wrap.appendChild(fc);

  // data
  const cbds=Object.values(DATA.cbds).filter(c=>MCD_BRAND==="all"||projectBrand(c.project)===MCD_BRAND);
  const f=forecastFactor();
  const atLevel=c=>MCD_LEVEL==="car"?cbdCarCost(c):cbdPartCost(c);
  const budgetTotal=cbds.reduce((s,c)=>s+(c.targetOriginal||0)*(MCD_LEVEL==="car"?(c.qtyPerCar||1):1),0);
  const forecastTotal=cbds.reduce((s,c)=>s+atLevel(c)*f,0);
  const actualTotal=cbds.reduce((s,c)=>s+atLevel(c),0);

  // KPIs (view-aware)
  const kpis=document.createElement("div"); kpis.className="grid grid-4";
  kpis.appendChild(Components.kpiCard("Budget ("+MCD_LEVEL+")","\u20B9 "+fmt(budgetTotal),null,"\u{1F3AF}"));
  kpis.appendChild(Components.kpiCard("Current actual","\u20B9 "+fmt(actualTotal),null,"\u{1F4C8}"));
  const dv=budgetTotal?((forecastTotal-budgetTotal)/budgetTotal*100):0;
  kpis.appendChild(Components.kpiCard("Forecast","\u20B9 "+fmt(forecastTotal),{dir:dv>0?"up":"down",text:(dv>=0?"+":"")+dv.toFixed(1)+"% vs budget"},"\u{1F52E}"));
  if(MCD_VIEW==="finance") kpis.appendChild(Components.kpiCard("Budget variance","\u20B9 "+fmt(forecastTotal-budgetTotal),{dir:dv>0?"up":"down",text:"P&L impact"},"\u{1F4B9}"));
  else kpis.appendChild(Components.kpiCard("Parts in scope",cbds.length,null,"\u{1F4E6}"));
  wrap.appendChild(kpis);

  // cost walk (Budget -> +commodity -> +forex -> -savings -> Forecast)
  const walk=document.createElement("div"); walk.className="panel"; walk.style.marginTop="16px";
  walk.innerHTML=`<div class="panel-header"><h3>Cost walk \u2014 Budget \u2192 Forecast (${MCD_LEVEL} level${MCD_BRAND!=="all"?", "+MCD_BRAND:""})</h3></div>`;
  const base=budgetTotal||1;
  const commodityDelta=MCD_FC.commodity?actualTotal*0.05:0;
  const forexDelta=MCD_FC.forex?actualTotal*0.03:0;
  const savingsDelta=MCD_FC.savings?-actualTotal*0.02:0;
  const steps=[
    {label:"Budget",val:budgetTotal,type:"anchor"},
    {label:"Actual vs budget",val:actualTotal-budgetTotal,type:"delta"},
    {label:"\u{1F535} Commodity +5%",val:commodityDelta,type:"delta",steel:true},
    {label:"Forex +3%",val:forexDelta,type:"delta"},
    {label:"Savings \u22122%",val:savingsDelta,type:"delta"},
    {label:"Forecast",val:forecastTotal,type:"anchor"},
  ];
  const maxV=Math.max(...steps.map(s=>s.type==="anchor"?s.val:Math.abs(s.val)),base)*1.1;
  const wb=document.createElement("div"); wb.className="panel-body";
  wb.innerHTML=`<div style="display:flex;gap:10px;align-items:flex-end;height:200px;">${steps.map(s=>{
    const h=Math.round(Math.abs(s.val)/maxV*160)+6;
    const col=s.type==="anchor"?"var(--navy)":s.steel?"var(--red)":s.val>=0?"var(--amber)":"var(--green)";
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="font-size:10.5px;font-weight:700;color:${col};">${s.type==='delta'&&s.val>=0?'+':''}\u20B9${fmt(s.val)}</div>
      <div style="width:64%;height:${h}px;background:${col};border-radius:4px 4px 0 0;${s.steel?'box-shadow:0 0 0 2px var(--red);':''}"></div>
      <div style="font-size:10px;color:var(--gray-600);text-align:center;line-height:1.2;">${s.label}</div></div>`;
  }).join("")}</div>`;
  walk.appendChild(wb); wrap.appendChild(walk);

  // part / car table
  const table=Components.masterTable({
    columns:[
      {key:"part",label:"Part"},
      {key:"__brand",label:"Brand",render:r=>projectBrand(r.project)},
      {key:"project",label:"Project"},
      {key:"__budget",label:"Budget (\u20B9)",render:r=>fmt((r.targetOriginal||0)*(MCD_LEVEL==="car"?(r.qtyPerCar||1):1))},
      {key:"__actual",label:"Actual (\u20B9)",render:r=>fmt(atLevel(r))},
      {key:"__fc",label:"Forecast (\u20B9)",render:r=>`<b>${fmt(atLevel(r)*f)}</b>`},
      {key:"__steel",label:"Steel-driven",render:r=>weightNet(r,"steel")>0?`<span class="chip chip-red"><span class="chip-dot"></span>steel</span>`:"\u2014"},
    ], rows:cbds, emptyText:"No parts in scope."
  });
  const tp=document.createElement("div"); tp.className="panel"; tp.style.marginTop="16px";
  tp.innerHTML=`<div class="panel-header"><h3>${MCD_VIEW==="finance"?"Finance":"Procurement"} detail</h3><span class="count-pill">${cbds.length}</span></div>`;
  tp.appendChild(table); wrap.appendChild(tp);
  return wrap;
}

function buildBenchmark(){
  const wrap=document.createElement("div");
  const canWrite = RBAC.role==="buyer" || RBAC.role==="finance" || RBAC.role==="pm" || RBAC.role==="admin" || RBAC.canWrite("*");
  wrap.appendChild(Components.pageHeader("Investment Benchmarking",
    "Upload random reference projects and compare our landed cost side-by-side. Parts above the external benchmark are flagged for renegotiation."));

  const bar=document.createElement("div"); bar.style.cssText="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;";
  if(canWrite){ const up=document.createElement("button"); up.className="btn btn-primary"; up.textContent="\u2B06\uFE0F Upload reference benchmark"; up.onclick=()=>openBenchUpload(); bar.appendChild(up); }
  wrap.appendChild(bar);

  // side-by-side: our parts vs nearest benchmark by commodity
  const cbds=Object.values(DATA.cbds);
  const grid=document.createElement("div"); grid.className="grid grid-2";
  const cmp=document.createElement("div"); cmp.className="panel";
  cmp.innerHTML=`<div class="panel-header"><h3>Side-by-side comparison</h3></div>`;
  const cb=document.createElement("div"); cb.className="panel-body";
  const part=partByNumber;
  const rowsHtml=cbds.map(c=>{
    const p=part(c.partNumber);
    const commodity=p?p.commodity:"Steel";
    const bm=DATA.benchmarks.find(b=>b.commodity===commodity);
    const our=cbdPartCost(c); const bench=bm?bm.benchPrice:null;
    const dv=bench?((our-bench)/bench*100):null;
    const over=dv!=null&&dv>0;
    return `<div style="padding:10px 0;border-bottom:1px solid var(--gray-100);">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;">
        <b>${c.part}</b><span class="text-muted">${commodity}</span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="flex:1;"><div style="font-size:10px;color:var(--gray-600);">Ours</div>
          <div style="height:14px;background:var(--blue);border-radius:4px;width:100%;"></div>
          <div style="font-size:11px;font-weight:700;">\u20B9${fmt(our)}</div></div>
        <div style="flex:1;"><div style="font-size:10px;color:var(--gray-600);">Benchmark</div>
          <div style="height:14px;background:var(--gray-200);border-radius:4px;width:${bench?Math.min(100,Math.round(bench/our*100)):0}%;"></div>
          <div style="font-size:11px;font-weight:700;">${bench?"\u20B9"+fmt(bench):"\u2014 no ref"}</div></div>
        <div style="width:96px;text-align:right;">${dv!=null?`<span class="chip ${over?'chip-red':'chip-green'}"><span class="chip-dot"></span>${dv>=0?'+':''}${dv.toFixed(1)}%</span>`:"\u2014"}</div>
      </div>${over?`<div style="font-size:11px;color:var(--red);margin-top:4px;">\u26A0\uFE0F Above benchmark \u2014 flag for renegotiation.</div>`:""}</div>`;
  }).join("");
  cb.innerHTML=rowsHtml||`<div class="table-empty">No CBDs to compare.</div>`;
  cmp.appendChild(cb); grid.appendChild(cmp);

  const refs=document.createElement("div"); refs.className="panel";
  refs.innerHTML=`<div class="panel-header"><h3>Uploaded references <span class="count-pill">${DATA.benchmarks.length}</span></h3></div>`;
  refs.appendChild(Components.masterTable({
    columns:[{key:"ref",label:"Reference"},{key:"commodity",label:"Commodity"},
      {key:"benchPrice",label:"Bench price (\u20B9)",render:r=>fmt(r.benchPrice)},{key:"note",label:"Note"}],
    rows:DATA.benchmarks, emptyText:"No references uploaded."
  }));
  grid.appendChild(refs);
  wrap.appendChild(grid);
  return wrap;
}

function openBenchUpload(){
  const comp=Components.uploadWithPreview({
    entityLabel:"Benchmark",
    columns:[{key:"ref",label:"Reference"},{key:"commodity",label:"Commodity"},{key:"benchPrice",label:"Bench price"}],
    sampleRows:()=>([
      {ref:"Ref C \u2014 random project X",commodity:"Copper",benchPrice:760},
      {ref:"Ref D \u2014 random project Y",commodity:"Steel",benchPrice:372},
      {ref:"",commodity:"Steel",benchPrice:400,__error:"Reference label required"},
    ]),
    onCommit:(valid)=>{
      valid.forEach((r,i)=>DATA.benchmarks.push({id:"BMU"+(DATA.benchmarks.length+i+1), ref:r.ref, commodity:r.commodity, benchPrice:+r.benchPrice||0, note:"Uploaded reference"}));
      Store.audit("Benchmark","upload commit",valid.length+" references");
      Toast.show(`${valid.length} reference project(s) uploaded \u2014 comparison refreshed.`,"success");
      setTimeout(()=>Router.render(),1000);
    }
  });
  Drawer.open("Upload reference benchmark","",null);
  const b=document.getElementById("drawer-body"); b.innerHTML=""; b.appendChild(comp);
  document.querySelector("#drawer .drawer-footer").style.display="none";
}

--------------------------------------------------------- */
Object.assign(SCREENS.procurement, {

});

Router.render();

})();

<script>
/* ============================================================
   E4 — TECHNICAL CHANGE MANAGEMENT
   ============================================================ */
(function(){
"use strict";

/* ---------------------------------------------------------
   1. STAGE MODEL
--------------------------------------------------------- */
const STAGES = ["Intake","AI Extraction","Evaluation","Validation","Supplier Offers","MOD Sheet","Impact","Approval","Implementation","Closed"];
const STAGE_SCREEN = {
  "Intake":"intake","AI Extraction":"doc-upload","Evaluation":"eval-sheet","Validation":"validation",
  "Supplier Offers":"supplier-offers","MOD Sheet":"mod-sheet","Impact":"impact-analysis",
  "Approval":"approval-workflow","Implementation":"implementation","Closed":"change-dashboard"
};

/* ---------------------------------------------------------
   2. TUL FIELD DICTIONARY (Appendix §21) — AI-extracted
--------------------------------------------------------- */
const TUL_FIELDS = [
  {k:"item",   label:"ITEM"},
  {k:"pl",     label:"PL"},
  {k:"nfuai",  label:"NFUAI"},
  {k:"partNo", label:"Part number"},
  {k:"pou",    label:"Point of use"},
  {k:"z",      label:"Z"},
  {k:"desig",  label:"Part designation"},
  {k:"partVal",label:"PART VAL."},
  {k:"uoq",    label:"UoQ"},
  {k:"ww",     label:"WW"},
  {k:"comTyp", label:"ComTypApp-Rel"},
  {k:"bmg",    label:"BMG 1–4"},
  {k:"desBrel",label:"DES. B-REL"},
  {k:"desBmg", label:"Des. BMG"},
  {k:"bmgObl", label:"BMG obligation"},
  {k:"brel",   label:"B_REL"},
  {k:"duns",   label:"DUNS 1–4 BMG"},
  {k:"actDate",label:"ACT.DATE"},
  {k:"deg",    label:"Design engineering group"},
  {k:"module", label:"Module type"},
  {k:"sdraw",  label:"SDRAW"},
  {k:"brand",  label:"Brand columns"},
];

/* ---------------------------------------------------------
   3. SEED — enrich existing DATA.changes with full detail
--------------------------------------------------------- */
const buyers   = DATA.users.filter(u=>u.role==="buyer").map(u=>u.name);
const srms      = DATA.users.filter(u=>u.role==="srm").map(u=>u.name);
const approvers = DATA.users.filter(u=>u.role==="approver").map(u=>u.name);

function tulSeed(c){
  return {
    item:"010", pl:"5", nfuai:"N", partNo:c.partNo, pou:"Front-LH",
    z:"Z1", desig:c.part, partVal:"A", uoq:"PCE", ww:"22",
    comTyp:"CTA-REL 2", bmg:"BMG 2", desBrel:"2026-05-14", desBmg:"Des-BMG-07",
    bmgObl:"Yes", brel:"B_REL-3", duns:c.supplierDuns, actDate:"2026-06-02",
    deg:"EG-Body-Interior", module:"MQB A/B", sdraw:"SD-"+c.partNo, brand:"VW · Skoda"
  };
}

// attributes present already: id,type,wf,part,status,stage
const CD = {}; // change detail keyed by change id
const partNoMap = {
  "Bracket-Rear-114":"8W0-800115","Bumper-Beam-227":"8W0-800228","Fastener-Set-A":"8W0-800031",
  "Wire-Harness-C3":"8W0-800052","Seat-Frame-B2":"8W0-800204"
};
const projMap = {
  "Bracket-Rear-114":"VW216/2IN","Bumper-Beam-227":"VW216/2IN","Fastener-Set-A":"SK216/2IN",
  "Wire-Harness-C3":"VW216/2IN","Seat-Frame-B2":"SK216/2IN"
};

DATA.changes.forEach((c,i)=>{
  c.partNo = partNoMap[c.part] || ("8W0-8000"+(50+i));
  c.project = projMap[c.part] || "VW216/2IN";
  const sup = DATA.suppliers[i % DATA.suppliers.length];
  c.supplier = sup.name; c.supplierDuns = sup.duns;
  const stageIdx = STAGES.indexOf(c.stage)>=0 ? STAGES.indexOf(c.stage) : 2;

  CD[c.id] = {
    ref:c, changeId:"CHG-"+c.wf.split("-").slice(1).join(""),
    createdBy:"P. Nair (AEKO Coord)", createdOn:"2026-07-1"+(i+2),
    reason:["Design revision — cavity re-profiling","Cost-down: material substitution","Supplier proposal — VA/VE",
            "Model-year update — connector spec","Running change — tolerance correction"][i%5],
    stageIdx,
    extracted: stageIdx>=1,
    evalVerified: stageIdx>=3,
    tul: tulSeed(c),
    tulVerified:{}, tulEdited:{},
    validation:{
      Project:{ok:true, note:"Matches active programme "+c.project},
      Part:{ok:true, note:"Part "+c.partNo+" found in master"},
      Supplier:{ok:true, note:"DUNS "+c.supplierDuns+" active"},
      BOM:{ok: i!==0, note: i!==0? "Part present in BOM at SOP" : "Not yet linked in BOM at SOP"},
      Price:{ok: i!==3, note: i!==3? "Current price on record" : "No effective price for revision date"},
      Revision:{ok: i!==0, note: i!==0? "Revision index consistent" : "Drawing revision C vs master rev B — mismatch"}
    },
    assign:{ buyer:buyers[i%buyers.length], srm:srms[i%srms.length],
             engineering:"EG-Body-Interior", approver:approvers[i%approvers.length] },
    supplier:{
      distributed: stageIdx>=4, distributedOn: stageIdx>=4? "2026-07-18":null,
      offerReceived: stageIdx>=4 && i!==3? true : (i===3),
      price: 451, timeline:"6 weeks", investment:"₹4.2 L (tooling mod)", tooling:"1 tool · 4 cavities", capacity:"OK — 52k/yr",
      locked: stageIdx>=5, clar:[]
    },
    mod:{ currency:"INR", rows:[
      {comp:"Material", cur:212, neu:null, src:"CBD knowledge source"},
      {comp:"Process",  cur:118, neu:null, src:"CBD knowledge source"},
      {comp:"Overhead", cur:64,  neu:null, src:"CBD knowledge source"},
      {comp:"D&D amort",cur:41,  neu:null, src:"Investment source"},
      {comp:"Logistics",cur:16,  neu:null, src:"CBD knowledge source"}
    ], overwrites:[] },
    impact:{
      commercial:"Piece-price increase of ₹18/pc offset partially by tooling amortisation over 3 yr.",
      technical:"Connector re-pinning; no fit/form change to mating harness. Drawing rev C.",
      supplyChain:"Single-source; supplier confirms capacity. Lead-time +2 wk during changeover.",
      production:"Line changeover at 0-Series; requires updated poke-yoke fixture.",
      risk: ["Medium","Low","Low","High","Medium"][i%5]
    },
    approvals: buildApprovalSeed(stageIdx),
    implementation: [
      {task:"Update price in CBD / price history", done:false},
      {task:"Update BOM at SOP", done:false},
      {task:"Update / re-issue Purchase Order (EBON)", done:false},
      {task:"Notify supplier of approval", done:false},
      {task:"Release updated drawing (rev C)", done:false},
      {task:"Raise tool modification order", done:false},
      {task:"Notify plant · quality · production", done:false},
      {task:"Confirm implementation & close change", done:false}
    ]
  };
});

function buildApprovalSeed(stageIdx){
  const chain = [
    {stage:"Engineering", role:"Eng owner"},
    {stage:"Quality",     role:"Quality"},
    {stage:"SRM",         role:"SRM engineer"},
    {stage:"Finance",     role:"Finance"},
    {stage:"Commodity",   role:"Commodity mgr"},
    {stage:"Management",  role:"Management"}
  ];
  // if past approval stage, mark all approved; if at approval stage, approve first few
  const approvedCount = stageIdx>7 ? 6 : (stageIdx===7 ? 3 : 0);
  return chain.map((s,i)=>({
    ...s,
    status: i<approvedCount ? "Approved" : "Pending",
    by: i<approvedCount ? DATA.users[(i+2)%DATA.users.length].name : null,
    on: i<approvedCount ? "2026-07-2"+(i) : null,
    comment: i<approvedCount ? "Reviewed — no objection." : "",
    signature: i<approvedCount ? DATA.users[(i+2)%DATA.users.length].name.replace(/\./g,"") : null
  }));
}

// map change status -> Open/Pending/Approved consistent with stage
DATA.changes.forEach(c=>{
  const d=CD[c.id];
  if(d.stageIdx>=9){c.status="Approved";}
  else if(d.stageIdx>=7){c.status="Pending";}
});

/* ---------------------------------------------------------
   4. ACTIVE CHANGE CONTEXT
--------------------------------------------------------- */
const ChangeCtx = {

  get(){ return CD[this.activeId]; },
  set(id){ this.activeId=id; Router.render(); }
};

/* ---------------------------------------------------------
   5. SHARED UI HELPERS
--------------------------------------------------------- */
function typeChip(t){

}
function ctxBar(){

  STAGES.forEach((s,i)=>{
    const cls = i<currentIdx?"done":(i===currentIdx?"current":"");

  Store.audit("Technical Change", "Stage → "+toStageName, d.ref.wf);
}

/* =========================================================
   E4.1a — CREATE / INTAKE CHANGE
========================================================= */
function buildIntake(){
  const wrap=document.createElement("div");
  wrap.appendChild(Components.pageHeader("Create / Intake Change",
    "Register an AEKO / AWE / AeA / Running / Model-Year / Supplier-proposal change. Upload the change PDF, Excel and drawings; a Change ID and unique workflow number are generated. Model-year changes may be entered manually."));

  const grid=document.createElement("div"); grid.className="grid grid-2";

  // left: create form
  const form=document.createElement("div"); form.className="panel";
  form.innerHTML=`<div class="panel-header"><h3>New change</h3></div><div class="panel-body" id="intake-form"></div>`;
  const fb=form.querySelector("#intake-form");
  const sel=(lab,id,opts)=>`<div class="form-row"><label>${lab}</label><select id="ik-${id}">${opts.map(o=>`<option>${o}</option>`).join("")}</select></div>`;
  const inp=(lab,id,ph="")=>`<div class="form-row"><label>${lab}</label><input id="ik-${id}" placeholder="${ph}"></div>`;
  fb.innerHTML =
    sel("Change type","type",["AEKO","AWE","AeA","Running","Model-Year","Supplier proposal"])+
    sel("Project","project",DATA.projects.map(p=>p.code))+

    inp("Reason / title","reason","e.g. Cavity re-profiling on rear bracket")+

       <textarea id="ik-manual" placeholder="Coordinator may enter TUL fields manually for internal tracking…"></textarea>
       <div class="hint">Manual entry is enabled for Model-Year changes where no supplier PDF exists.</div></div>`;
  const typeSel=fb.querySelector("#ik-type");
  typeSel.onchange=()=>{ fb.querySelector("#ik-manual-wrap").style.display = typeSel.value==="Model-Year"?"block":"none"; };

  // right: upload
  const up=document.createElement("div"); up.className="panel";

    <div class="panel-body">
      <div class="upload-drop"><div class="icon">📎</div><div><b>Drop change PDF + Excel + drawings</b></div>
        <div class="text-muted" style="margin:6px 0 12px;">PDF · XLSX · DWG/PDF drawings</div></div>
      <div id="ik-docs" style="margin-top:14px;"></div>
    </div>`;
  const docs=up.querySelector("#ik-docs");
  const seededDocs=[
    {i:"📄",n:"AEKO_change_package.pdf",m:"1.8 MB · technical change document"},
    {i:"📊",n:"cost_impact_worksheet.xlsx",m:"96 KB · price & BOM lines"},
    {i:"📐",n:"drawing_revC.pdf",m:"640 KB · engineering drawing"}
  ];
  function renderDocs(){ docs.innerHTML = seededDocs.map(d=>`<div class="docrow"><div class="di">${d.i}</div><div class="dn"><b>${d.n}</b><div>${d.m}</div></div><span class="chip chip-green"><span class="chip-dot"></span>attached</span></div>`).join(""); }

/* =========================================================
   E4.1c — TECHNICAL EVALUATION SHEET (TUL fields, verify/edit)
========================================================= */
function buildEvalSheet(){
  const d=ChangeCtx.get();
  const wrap=e4Head("Technical Evaluation Sheet",
    "System-drafted from AI-extracted TUL fields. The AEKO Coordinator verifies or edits each field, then triggers the sheet — with the PDF/technical details — to the assigned buyer.");

  if(!d.extracted){
    wrap.appendChild(Components.el(`<div class="coming-soon" style="border-color:var(--amber);"><div class="cs-icon">✦</div><div class="cs-title">No extraction yet</div><div class="text-muted">Run AI extraction on the uploaded documents first.</div><button class="btn btn-primary" style="margin-top:14px;" onclick="Router.go('doc-upload')">Go to AI extraction</button></div>`));
    return wrap;
  }

  const canWrite = RBAC.role==="aeko" || RBAC.role==="admin" || RBAC.role==="pm";
  const panel=document.createElement("div"); panel.className="panel";
  const verifiedCount=()=>Object.values(d.tulVerified).filter(Boolean).length;
  panel.innerHTML=`<div class="panel-header"><h3>TUL evaluation fields <span class="count-pill" id="ev-count">${verifiedCount()}/${TUL_FIELDS.length} verified</span></h3>
    <div class="flex gap-8">${canWrite?`<button class="btn btn-sm" id="ev-verall">Verify all</button>`:`<span class="chip chip-amber"><span class="chip-dot"></span>Read-only for ${ROLES.find(r=>r.id===RBAC.role).label}</span>`}</div></div>
    <div class="panel-body"><div class="grid grid-2" id="ev-fields"></div></div>`;
  const host=panel.querySelector("#ev-fields");

  function fieldRow(f){
    const verified=!!d.tulVerified[f.k];
    const edited=!!d.tulEdited[f.k];
    const el=document.createElement("div"); el.className="tul-field";
    el.innerHTML=`<div class="tul-lab"><span class="k">${f.label}</span>
      <span>${verified?`<span class="ai-badge verified">✓ verified</span>`:`<span class="ai-badge">✦ AI-extracted</span>`}</span></div>
      <input value="${(d.tul[f.k]??"").toString().replace(/"/g,'&quot;')}" class="${edited?"edited":""}" ${canWrite?"":"disabled"}>`;
    const input=el.querySelector("input");
    input.oninput=()=>{ d.tul[f.k]=input.value; d.tulEdited[f.k]=true; d.tulVerified[f.k]=true; input.classList.add("edited");
      el.querySelector(".tul-lab span:last-child").innerHTML=`<span class="ai-badge verified">✓ verified</span>`; updateCount(); };
    if(canWrite){
      // clicking the field marks it verified (coordinator reviewed it)
      input.onblur=()=>{ if(!d.tulVerified[f.k]){ d.tulVerified[f.k]=true; el.querySelector(".tul-lab span:last-child").innerHTML=`<span class="ai-badge verified">✓ verified</span>`; updateCount(); } };
    }
    return el;
  }
  function updateCount(){ panel.querySelector("#ev-count").textContent=`${verifiedCount()}/${TUL_FIELDS.length} verified`; }
  TUL_FIELDS.forEach(f=>host.appendChild(fieldRow(f)));
  if(canWrite){
    panel.querySelector("#ev-verall").onclick=()=>{ TUL_FIELDS.forEach(f=>d.tulVerified[f.k]=true); Router.render(); Toast.show("All TUL fields marked verified.","success"); };
  }
  wrap.appendChild(panel);

  // trigger to buyer
  const foot=document.createElement("div"); foot.className="panel"; foot.style.marginTop="16px";
  const allVerified=verifiedCount()===TUL_FIELDS.length;
  foot.innerHTML=`<div class="panel-body" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <button class="btn btn-primary" id="ev-trigger" ${(!canWrite||!allVerified)?"disabled style=opacity:.4;":""}>Verify &amp; trigger to buyer →</button>
    <span class="text-muted" style="font-size:12px;">Sends the evaluation sheet + PDF/technical details to <b>${d.assign.buyer}</b> and moves the change to Validation &amp; Triage.</span></div>`;
  if(canWrite && allVerified){
    foot.querySelector("#ev-trigger").onclick=()=>{ d.evalVerified=true; advanceStage("Validation"); Toast.show(`Evaluation sheet triggered to ${d.assign.buyer}. Change moved to Validation & Triage.`,"success"); Router.go("validation"); };
  }
  wrap.appendChild(foot);
  return wrap;
}

      <span style="font-size:18px;">⏰</span><div><b>Daily reminder to buyer ${d.assign.buyer}</b><div class="text-muted" style="font-size:12px;">Distributed ${s.distributedOn} · <b>${dayssince} days</b> since distribution — offer still ${s.offerReceived?"not locked":"awaited"}.</div></div></div></div>`);

  const of=(lab,id,val,ph="")=>`<div class="form-row"><label>${lab}</label><input id="so-${id}" value="${val||""}" placeholder="${ph}" ${lock?"disabled":""}></div>`;
  sf.innerHTML =
    of("Offered piece price (₹)","price",s.price||"")+
    of("Timeline / lead-time","timeline",s.timeline)+
    of("Investment (tooling/CAPEX)","investment",s.investment)+
    of("Tooling","tooling",s.tooling)+
    of("Capacity","capacity",s.capacity)+
    `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">
      ${lock?`<span class="chip chip-green"><span class="chip-dot"></span>Offer locked — read-only</span>`:`
      <button class="btn" id="so-save">Save offer</button>
      <button class="btn btn-primary" id="so-lock">🔒 Lock final offer</button>`}
    </div>`;
  if(!lock && canWrite){
    sf.querySelector("#so-save").onclick=()=>{ ["price","timeline","investment","tooling","capacity"].forEach(k=>s[k]=sf.querySelector("#so-"+k).value); s.offerReceived=true; Toast.show("Offer captured.","success"); Router.render(); };
    sf.querySelector("#so-lock").onclick=()=>{ ["price","timeline","investment","tooling","capacity"].forEach(k=>s[k]=sf.querySelector("#so-"+k).value); s.offerReceived=true; s.locked=true; advanceStage("MOD Sheet"); Store.audit("Technical Change","Supplier offer locked", d.ref.wf); Toast.show("Final offer locked. MOD sheet ready.","success"); Router.render(); };
  }

  // clarification loop
  const cp=document.createElement("div"); cp.className="panel";
  cp.innerHTML=`<div class="panel-header"><h3>Buyer ⇄ supplier clarifications</h3></div><div class="panel-body">
    <div id="so-clar" style="max-height:220px;overflow:auto;margin-bottom:12px;"></div>

    <button class="btn btn-primary" id="so-clar-add" ${lock?"disabled style=opacity:.4;":""}>Send</button></div></div>`;

      cp.querySelector("#so-clar-in").value=""; renderClar(); };
  }
  grid.appendChild(op); grid.appendChild(cp);
  wrap.appendChild(grid);
  return wrap;
}

/* =========================================================
   E4.3b — MOD SHEET (fetch current price, enter new, delta)
========================================================= */
function buildModSheet(){
  const d=ChangeCtx.get(); const m=d.mod;
  const wrap=e4Head("MOD Sheet",
    "Current prices are auto-fetched from the knowledge source (overwritable — previous values are recorded). The buyer enters the new prices; the delta feeds cost-impact analysis.");

  const canWrite = RBAC.role==="buyer"||RBAC.role==="admin"||RBAC.role==="pm";
  const panel=document.createElement("div"); panel.className="panel";
  panel.innerHTML=`<div class="panel-header"><h3>Modification (MOD) price sheet · ${m.currency}</h3>
    <button class="btn btn-sm" id="mod-fetch">↻ Re-fetch current prices</button></div>
    <div class="panel-body no-pad"><table class="mtable"><thead><tr><th>Cost component</th><th>Current (fetched)</th><th>Source</th><th>New price</th><th>Delta</th></tr></thead><tbody id="mod-rows"></tbody>
    <tfoot></tfoot></table></div>`;
  const tb=panel.querySelector("#mod-rows");

  function totalCur(){ return m.rows.reduce((a,r)=>a+(+r.cur||0),0); }
  function totalNeu(){ return m.rows.reduce((a,r)=>a+(r.neu!=null?+r.neu:+r.cur||0),0); }
  function renderRows(){
    tb.innerHTML="";
    m.rows.forEach((r,idx)=>{
      const neu = r.neu!=null? r.neu : "";
      const delta = r.neu!=null ? (+r.neu - +r.cur) : null;
      const tr=document.createElement("tr");
      tr.innerHTML=`<td data-label="Component">${r.comp}</td>
        <td data-label="Current"><span style="display:inline-flex;align-items:center;gap:6px;"><b>${r.cur}</b> <span class="ai-badge">✦ fetched</span></span>
          ${r.prev!=null?`<div class="text-muted" style="font-size:10px;">prev fetched: <span class="hist-strike">${r.prev}</span></div>`:""}</td>
        <td data-label="Source"><span class="text-muted" style="font-size:11px;">${r.src}</span></td>
        <td data-label="New"><input value="${neu}" data-i="${idx}" style="width:90px;padding:6px 8px;border:1px solid var(--gray-200);border-radius:6px;font-size:12.5px;" ${canWrite?"":"disabled"}></td>
        <td data-label="Delta">${delta==null?"—":`<span class="${delta>0?"delta-pos":delta<0?"delta-neg":""}">${delta>0?"+":""}${delta}</span>`}</td>`;
      tb.appendChild(tr);
    });
    // total row
    const tot=document.createElement("tr"); tot.style.background="var(--gray-50)";
    const dTot=totalNeu()-totalCur();
    tot.innerHTML=`<td data-label="Component"><b>Total piece price</b></td><td data-label="Current"><b>${totalCur()}</b></td><td></td>
      <td data-label="New"><b>${totalNeu()}</b></td><td data-label="Delta"><b class="${dTot>0?"delta-pos":dTot<0?"delta-neg":""}">${dTot>0?"+":""}${dTot}</b></td>`;
    tb.appendChild(tot);
    tb.querySelectorAll("input[data-i]").forEach(inp=>{
      inp.oninput=()=>{ const i=+inp.dataset.i; m.rows[i].neu = inp.value===""?null:(+inp.value); renderRows(); };
    });
  }
  renderRows();
  panel.querySelector("#mod-fetch").onclick=()=>{
    // overwrite current with a fresh fetch, recording previous value
    m.rows.forEach(r=>{ r.prev=r.cur; r.cur = Math.round(r.cur*(1+(Math.random()*0.06-0.02))); });
    m.overwrites.push({on:TODAY, by:"knowledge source"});
    Store.audit("Technical Change","MOD current prices re-fetched (previous recorded)", d.ref.wf);
    Toast.show("Current prices re-fetched. Previous values recorded.","success"); renderRows();
  };
  wrap.appendChild(panel);

  // proceed
  const foot=document.createElement("div"); foot.className="panel"; foot.style.marginTop="16px";
  foot.innerHTML=`<div class="panel-body" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
    <button class="btn btn-primary" id="mod-next" ${canWrite?"":"disabled style=opacity:.4;"}>Save MOD &amp; open Impact Analysis →</button>
    <span class="text-muted" style="font-size:12px;">The total delta is carried into the impact &amp; cost analysis.</span></div>`;
  if(canWrite) foot.querySelector("#mod-next").onclick=()=>{ advanceStage("Impact"); Toast.show("MOD sheet saved.","success"); Router.go("impact-analysis"); };
  wrap.appendChild(foot);
  return wrap;
}
