<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVWIPL · Procurement Digitalisation with AI — E4</title>
<style>
/* =========================================================
   SAVWIPL PROTOTYPE — DESIGN TOKENS
   ========================================================= */
:root{
  --navy:#1F3864;
  --blue:#2E5496;
  --light:#EDF1FA;
  --green:#1B8A5A;
  --amber:#B8860B;
  --red:#C0392B;
  --gray-50:#F7F8FB;
  --gray-100:#EEF1F6;
  --gray-200:#DDE3EE;
  --gray-400:#9AA5B8;
  --gray-600:#5B6579;
  --gray-800:#232A38;
  --white:#ffffff;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 3px rgba(31,56,100,.08), 0 1px 2px rgba(31,56,100,.06);
  --shadow-md:0 6px 20px rgba(31,56,100,.12);
  --topbar-h:58px;
  --nav-w:250px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"Segoe UI",Inter,system-ui,-apple-system,Arial,sans-serif;
  background:var(--gray-50);
  color:var(--gray-800);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:4px;}

/* =========================================================
   APP SHELL
   ========================================================= */
#app-shell{display:flex;flex-direction:column;height:100vh;}

/* ---------- TOP BAR ---------- */
#topbar{
  height:var(--topbar-h);
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 16px;
  flex-shrink:0;
  z-index:50;
  position:relative;
}
#topbar .brand{
  display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;
  padding:8px 10px;border-radius:var(--radius-sm);
}
#topbar .brand:hover{background:rgba(255,255,255,.08);}
#topbar .brand .logo-mark{
  width:26px;height:26px;border-radius:7px;background:var(--blue);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;
}
#module-switcher{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:3px;border-radius:9px;}
#module-switcher button{
  border:none;background:transparent;color:rgba(255,255,255,.75);
  padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;white-space:nowrap;
}
#module-switcher button.active{background:#fff;color:var(--navy);}
#module-switcher button:not(.active):hover{color:#fff;background:rgba(255,255,255,.08);}
#module-switcher button[disabled]{opacity:.35;cursor:not-allowed;}

#global-search-wrap{flex:1;max-width:520px;position:relative;}
#global-search{
  width:100%;padding:9px 14px 9px 36px;border-radius:9px;border:1px solid transparent;
  background:rgba(255,255,255,.12);color:#fff;font-size:13px;
}
#global-search::placeholder{color:rgba(255,255,255,.6);}
#global-search:focus{outline:none;background:#fff;color:var(--gray-800);}
#global-search:focus::placeholder{color:var(--gray-400);}
#global-search-wrap .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.7;font-size:14px;pointer-events:none;}
#search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;color:var(--gray-800);
  border-radius:var(--radius);box-shadow:var(--shadow-md);padding:8px;display:none;max-height:360px;overflow:auto;z-index:80;
}
#search-results.show{display:block;}
#search-results .grp{padding:6px 8px;font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.04em;}
#search-results .res-row{padding:8px 10px;border-radius:8px;display:flex;justify-content:space-between;gap:8px;}
#search-results .res-row:hover{background:var(--gray-100);}
#search-results .res-row .t{font-weight:600;font-size:13px;}
#search-results .res-row .s{font-size:11px;color:var(--gray-600);}

.topbar-icon-btn{
  position:relative;background:rgba(255,255,255,.08);border:none;color:#fff;
  width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.topbar-icon-btn:hover{background:rgba(255,255,255,.18);}
.topbar-icon-btn .badge{
  position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  border-radius:9px;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:2px solid var(--navy);
}
#reports-btn{
  background:rgba(255,255,255,.08);border:none;color:#fff;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;flex-shrink:0;
}
#reports-btn:hover{background:rgba(255,255,255,.18);}
#env-badge{
  background:rgba(255,255,255,.14);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  padding:5px 10px;border-radius:6px;flex-shrink:0;border:1px solid rgba(255,255,255,.2);
}
#role-switcher-wrap{flex-shrink:0;position:relative;}
#role-switcher{
  background:#fff;color:var(--navy);border:1px solid rgba(255,255,255,.35);
  padding:8px 32px 8px 13px;border-radius:9px;font-size:13px;font-weight:700;appearance:none;
  -webkit-appearance:none;-moz-appearance:none;cursor:pointer;box-shadow:var(--shadow);
}
#role-switcher:hover{background:#f4f7ff;}
#role-switcher:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,84,150,.25);}
#role-switcher option{color:var(--gray-800);background:#fff;font-weight:600;}
#role-switcher-wrap::after{
  content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--blue);pointer-events:none;font-size:11px;
}
/* ---------- STATUS INDICATOR (dot-only, no label) for grids ---------- */
.chip.chip-ind{padding:5px;gap:0;border-radius:50%;min-width:0;line-height:0;}
.chip.chip-ind .chip-dot{width:10px;height:10px;}

/* ---------- BODY LAYOUT ---------- */
#app-body{flex:1;display:flex;min-height:0;}

/* ---------- LEFT NAV ---------- */
#leftnav{
  width:var(--nav-w);flex-shrink:0;background:#fff;border-right:1px solid var(--gray-200);
  overflow-y:auto;padding:14px 10px;transition:transform .2s ease, margin .2s ease;
}
#leftnav .nav-module-label{
  font-size:11px;font-weight:800;color:var(--gray-400);text-transform:uppercase;letter-spacing:.06em;
  padding:6px 10px 10px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:500;color:var(--gray-800);margin-bottom:2px;
}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--gray-200);flex-shrink:0;}
.nav-item:hover{background:var(--light);}
.nav-item.active{background:var(--blue);color:#fff;font-weight:700;}
.nav-item.active .dot{background:#fff;}
.nav-item.locked{opacity:.4;cursor:not-allowed;}
.nav-item.locked:hover{background:transparent;}
.nav-section-gap{height:10px;}

#nav-backdrop{display:none;position:fixed;inset:0;background:rgba(20,30,50,.4);z-index:39;}

/* ---------- CONTENT ---------- */
#content{flex:1;overflow-y:auto;padding:22px 26px 60px;min-width:0;}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-header h1{font-size:20px;margin:0 0 4px;color:var(--navy);}
.page-header p.sub{margin:0;color:var(--gray-600);font-size:13px;}
.breadcrumb{font-size:12px;color:var(--gray-400);margin-bottom:6px;}
.breadcrumb b{color:var(--gray-600);}

.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:720px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

/* ---------- COMPONENT: KPI CARD ---------- */
.kpi-card{
  background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--gray-200);
}
.kpi-card .kpi-label{font-size:12px;color:var(--gray-600);font-weight:600;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.kpi-card .kpi-value{font-size:26px;font-weight:800;color:var(--navy);}
.kpi-card .kpi-trend{font-size:12px;margin-top:6px;font-weight:600;}
.kpi-card .kpi-trend.up{color:var(--green);}
.kpi-card .kpi-trend.down{color:var(--red);}
.kpi-card .kpi-icon{font-size:16px;opacity:.5;}

/* ---------- COMPONENT: CARD / PANEL ---------- */
.panel{background:#fff;border-radius:var(--radius);border:1px solid var(--gray-200);box-shadow:var(--shadow);}
.panel-header{
  padding:14px 18px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;
}
.panel-header h3{margin:0;font-size:14.5px;color:var(--navy);}
.panel-header .count-pill{background:var(--light);color:var(--blue);font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:8px;}
.panel-body{padding:16px 18px;}
.panel-body.no-pad{padding:0;}

/* ---------- COMPONENT: TASK CARD ---------- */
.task-list{display:flex;flex-direction:column;gap:0;}
.task-card{
  display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--gray-100);
}
.task-card:last-child{border-bottom:none;}
.task-card .task-icon{
  width:34px;height:34px;border-radius:9px;background:var(--light);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;
}
.task-card .task-body{flex:1;min-width:0;}
.task-card .task-title{font-weight:600;font-size:13.2px;color:var(--gray-800);}
.task-card .task-meta{font-size:11.5px;color:var(--gray-600);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.task-card .task-action{flex-shrink:0;}
.btn{
  border:1px solid var(--gray-200);background:#fff;color:var(--gray-800);padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;
}
.btn:hover{background:var(--gray-100);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--navy);}
.btn-sm{padding:4px 9px;font-size:11.5px;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--gray-100);}

/* ---------- COMPONENT: STATUS / FRESHNESS CHIPS ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.chip-dot{width:6px;height:6px;border-radius:50%;}
.chip-green{background:#E6F4EC;color:var(--green);}
.chip-green .chip-dot{background:var(--green);}
.chip-amber{background:#FBF1DC;color:var(--amber);}
.chip-amber .chip-dot{background:var(--amber);}
.chip-red{background:#FBEAE8;color:var(--red);}
.chip-red .chip-dot{background:var(--red);}
.chip-gray{background:var(--gray-100);color:var(--gray-600);}
.chip-gray .chip-dot{background:var(--gray-400);}
.chip-blue{background:var(--light);color:var(--blue);}
.chip-blue .chip-dot{background:var(--blue);}

/* workflow number chip */
.wf-chip{
  font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;font-weight:700;background:var(--gray-100);
  color:var(--gray-600);padding:3px 8px;border-radius:6px;letter-spacing:.02em;
}

/* ---------- COMPONENT: MASTER TABLE ---------- */
.table-toolbar{display:flex;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--gray-100);flex-wrap:wrap;}
.table-toolbar input[type=text]{
  padding:7px 10px;border:1px solid var(--gray-200);border-radius:8px;font-size:12.5px;flex:1;min-width:160px;
}
.table-toolbar select{padding:7px 10px;border:1px solid var(--gray-200);border-radius:8px;font-size:12.5px;background:#fff;}
table.mtable{width:100%;border-collapse:collapse;font-size:12.8px;}
table.mtable th{
  text-align:left;padding:10px 14px;background:var(--gray-50);color:var(--gray-600);font-weight:700;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--gray-200);cursor:pointer;white-space:nowrap;
}
table.mtable th:hover{color:var(--navy);}
table.mtable td{padding:10px 14px;border-bottom:1px solid var(--gray-100);color:var(--gray-800);}
table.mtable tbody tr:hover{background:var(--light);}
.table-empty{padding:40px 20px;text-align:center;color:var(--gray-400);font-size:13px;}
.table-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;font-size:12px;color:var(--gray-600);}

/* ---------- COMPONENT: DRAWER FORM ---------- */
#drawer-backdrop{
  position:fixed;inset:0;background:rgba(20,30,50,.4);display:none;z-index:90;
}
#drawer-backdrop.show{display:block;}
#drawer{
  position:fixed;top:0;right:-460px;width:440px;max-width:92vw;height:100%;background:#fff;z-index:91;
  box-shadow:-8px 0 30px rgba(0,0,0,.15);transition:right .22s ease;display:flex;flex-direction:column;
}
#drawer.show{right:0;}
#drawer .drawer-head{padding:18px 20px;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;}
#drawer .drawer-head h3{margin:0;font-size:16px;color:var(--navy);}
#drawer .drawer-close{background:var(--gray-100);border:none;width:30px;height:30px;border-radius:8px;font-size:15px;}
#drawer .drawer-body{flex:1;overflow-y:auto;padding:20px;}
#drawer .drawer-footer{padding:16px 20px;border-top:1px solid var(--gray-100);display:flex;justify-content:flex-end;gap:8px;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12px;font-weight:700;color:var(--gray-600);margin-bottom:5px;}
.form-row input,.form-row select,.form-row textarea{
  width:100%;padding:9px 11px;border:1px solid var(--gray-200);border-radius:8px;font-size:13px;font-family:inherit;
}
.form-row textarea{resize:vertical;min-height:70px;}
.form-row .hint{font-size:11px;color:var(--gray-400);margin-top:4px;}

/* ---------- COMPONENT: UPLOAD WITH PREVIEW ---------- */
.upload-drop{
  border:2px dashed var(--gray-200);border-radius:var(--radius);padding:28px;text-align:center;color:var(--gray-600);
  background:var(--gray-50);
}
.upload-drop .icon{font-size:26px;margin-bottom:8px;}
.upload-steps{display:flex;gap:6px;margin-bottom:16px;}
.upload-steps .step{flex:1;text-align:center;padding:8px;border-radius:8px;background:var(--gray-100);font-size:11.5px;font-weight:700;color:var(--gray-400);}
.upload-steps .step.active{background:var(--light);color:var(--blue);}
.upload-steps .step.done{background:#E6F4EC;color:var(--green);}

/* ---------- COMPONENT: APPROVAL TIMELINE ---------- */
.timeline{list-style:none;margin:0;padding:0;}
.timeline li{display:flex;gap:12px;padding-bottom:18px;position:relative;}
.timeline li:last-child{padding-bottom:0;}
.timeline li::before{
  content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--gray-200);
}
.timeline li:last-child::before{display:none;}
.timeline .tl-dot{
  width:24px;height:24px;border-radius:50%;background:var(--gray-100);color:var(--gray-400);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;z-index:1;
}
.timeline li.done .tl-dot{background:var(--green);color:#fff;}
.timeline li.current .tl-dot{background:var(--blue);color:#fff;}
.timeline .tl-body{padding-top:2px;}
.timeline .tl-title{font-weight:700;font-size:13px;}
.timeline .tl-meta{font-size:11.5px;color:var(--gray-600);margin-top:2px;}

/* ---------- COMPONENT: AI SLIDE-OVER ---------- */
#ai-backdrop{position:fixed;inset:0;background:rgba(20,30,50,.35);display:none;z-index:95;}
#ai-backdrop.show{display:block;}
#ai-slideover{
  position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100%;background:#fff;z-index:96;
  box-shadow:-8px 0 30px rgba(0,0,0,.18);transition:right .22s ease;display:flex;flex-direction:column;
}
#ai-slideover.show{right:0;}
#ai-slideover .ai-head{
  padding:16px 18px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:flex;justify-content:space-between;align-items:center;
}
#ai-slideover .ai-head h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;}
#ai-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:8px;}
#ai-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.ai-msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.5;}
.ai-msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:3px;}
.ai-msg.bot{align-self:flex-start;background:var(--gray-100);color:var(--gray-800);border-bottom-left-radius:3px;}
.ai-msg .ai-chart{margin-top:8px;background:#fff;border:1px solid var(--gray-200);border-radius:8px;padding:8px;}
.ai-suggestions{padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--gray-100);}
.ai-suggestion-chip{background:var(--light);color:var(--blue);border:none;font-size:11.5px;padding:6px 10px;border-radius:20px;font-weight:600;}
.ai-suggestion-chip:hover{background:var(--blue);color:#fff;}
#ai-input-row{padding:12px 16px;border-top:1px solid var(--gray-100);display:flex;gap:8px;}
#ai-input-row input{flex:1;padding:10px 12px;border:1px solid var(--gray-200);border-radius:9px;font-size:13px;}
#ai-input-row button{background:var(--blue);color:#fff;border:none;width:38px;border-radius:9px;font-size:15px;}

/* ---------- NOTIFICATIONS PANEL ---------- */
#notif-panel{
  position:absolute;top:calc(var(--topbar-h) + 6px);right:16px;width:360px;max-width:90vw;background:#fff;color:var(--gray-800);
  border-radius:var(--radius);box-shadow:var(--shadow-md);z-index:70;display:none;max-height:70vh;overflow-y:auto;
}
#notif-panel.show{display:block;}
#notif-panel .np-head{padding:14px 16px;border-bottom:1px solid var(--gray-100);font-weight:700;color:var(--navy);}

/* ---------- PLACEHOLDER SCREEN ---------- */
.coming-soon{
  border:1.5px dashed var(--gray-200);border-radius:var(--radius);padding:50px 30px;text-align:center;color:var(--gray-400);
}
.coming-soon .cs-icon{font-size:30px;margin-bottom:10px;}
.coming-soon .cs-title{font-weight:700;color:var(--gray-600);font-size:14px;margin-bottom:4px;}
.coming-soon .cs-epic{font-size:12px;background:var(--light);color:var(--blue);display:inline-block;padding:3px 10px;border-radius:20px;margin-top:8px;font-weight:700;}

/* ---------- FRESHNESS BOARD ROW ---------- */
.fb-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--gray-100);}
.fb-row:last-child{border-bottom:none;}
.fb-row .fb-icon{width:32px;height:32px;border-radius:8px;background:var(--gray-100);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fb-row .fb-body{flex:1;min-width:0;}
.fb-row .fb-name{font-weight:600;font-size:13px;}
.fb-row .fb-meta{font-size:11.5px;color:var(--gray-600);}

/* Toast */
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:120;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--gray-800);color:#fff;padding:10px 16px;border-radius:9px;font-size:12.5px;box-shadow:var(--shadow-md);
  display:flex;align-items:center;gap:8px;animation:toastIn .2s ease;
}
.toast.success{background:var(--green);}
.toast.warn{background:var(--amber);}
@keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---------- MOBILE / IPAD RESPONSIVE ---------- */
#hamburger{display:none;}
@media (max-width:960px){
  #hamburger{display:flex;}
  #leftnav{
    position:fixed;top:var(--topbar-h);left:0;bottom:0;z-index:40;transform:translateX(-100%);
    box-shadow:6px 0 24px rgba(0,0,0,.15);
  }
  #leftnav.open{transform:translateX(0);}
  #nav-backdrop.show{display:block;}
  #global-search-wrap{display:none;}
  #env-badge{display:none;}
}
@media (max-width:720px){
  table.mtable thead{display:none;}
  table.mtable, table.mtable tbody, table.mtable tr, table.mtable td{display:block;width:100%;}
  table.mtable tr{border-bottom:8px solid var(--gray-50);padding:8px 0;}
  table.mtable td{border-bottom:none;display:flex;justify-content:space-between;gap:10px;padding:6px 14px;}
  table.mtable td::before{content:attr(data-label);font-weight:700;color:var(--gray-600);font-size:11px;}

/* ---------------------------------------------------------

--------------------------------------------------------- */
const Store = {
  audit(entity, action, ref){
    DATA.auditLog.unshift({
      id:"A"+(DATA.auditLog.length+1),
      when:new Date().toISOString().slice(0,19).replace("T"," "),
      user:DATA.users.find(u=>u.role===RBAC.role)?.name || "System",
      role:RBAC.role, entity, action, ref
    });
  },
  touch(rec){ rec.lastUpdated = TODAY; },
  daysSince(dateStr){
    const d = new Date(dateStr), now = new Date(TODAY);
    return Math.round((now-d)/86400000);
  },
  // freshness threshold by cadence (days)
  freshnessDaysOverdue(rec, cadenceDays){
    const age = this.daysSince(rec.lastUpdated || TODAY);
    return Math.max(0, age - cadenceDays);
  },
  /* Resolve the value valid ON a given date.
     entity = a record with a `history` array of {effectiveFrom,value}.
     Returns the value whose effectiveFrom is the latest date <= `date`. */
  getValueOn(entity, date){
    if(!entity || !entity.history || !entity.history.length) return null;
    const target = new Date(date);
    const eligible = entity.history
      .filter(h => new Date(h.effectiveFrom) <= target)
      .sort((a,b)=> new Date(a.effectiveFrom) - new Date(b.effectiveFrom));
    return eligible.length ? eligible[eligible.length-1].value : null;
  },
  currentValue(entity){
    if(!entity || !entity.history || !entity.history.length) return null;
    return this.getValueOn(entity, TODAY) ?? entity.history[entity.history.length-1].value;
  }
};

const Router = {
  module: "procurement",

const Components = {
  el(html){
    const d = document.createElement("div");
    d.innerHTML = html.trim();
    return d.firstElementChild;
  },
  pageHeader(title, sub){
    return this.el(`<div class="page-header"><div><div class="breadcrumb">${MODULES.find(m=>m.id===Router.module).label} <b>›</b> ${title}</div><h1>${title}</h1>${sub? `<p class="sub">${sub}</p>`:""}</div></div>`);
  },
  kpiCard(label, value, trend, icon){
    const trendHtml = trend? `<div class="kpi-trend ${trend.dir}">${trend.dir==='up'?'▲':'▼'} ${trend.text}</div>` : "";
    return this.el(`<div class="kpi-card"><div class="kpi-label">${label} <span class="kpi-icon">${icon||""}</span></div><div class="kpi-value">${value}</div>${trendHtml}</div>`);
  },
  chip(status){
    // status: Fresh/Due/Overdue OR Open/Pending/Approved OR Green/Amber/Red
    const map = {
      "Fresh":"chip-green", "Due":"chip-amber", "Overdue":"chip-red",
      "Open":"chip-blue", "Pending":"chip-amber", "Approved":"chip-green", "Rejected":"chip-red",
      "Green":"chip-green","Amber":"chip-amber","Red":"chip-red",
    };
    const cls = map[status] || "chip-gray";
    return `<span class="chip ${cls}"><span class="chip-dot"></span>${status}</span>`;
  },
  freshnessChip(daysOverdue){
    if(daysOverdue<=0) return this.chip("Fresh");
    if(daysOverdue<=7) return this.chip("Due");
    return this.chip("Overdue");
  },
  // dot-only status indicator for grids (label available on hover)
  statusDot(status){
    const map = {
      "Fresh":"chip-green","Due":"chip-amber","Overdue":"chip-red",
      "Open":"chip-blue","Pending":"chip-amber","Approved":"chip-green","Rejected":"chip-red",
      "Green":"chip-green","Amber":"chip-amber","Red":"chip-red",
    };
    const cls = map[status] || "chip-gray";
    return `<span class="chip ${cls} chip-ind" title="${status}"><span class="chip-dot"></span></span>`;
  },
  freshnessDot(daysOverdue){
    return this.statusDot(daysOverdue<=0?"Fresh":daysOverdue<=7?"Due":"Overdue");
  },
  wfChip(code){
    return `<span class="wf-chip">${code}</span>`;
  },
  taskCard(t){
    return this.el(`
      <div class="task-card">
        <div class="task-icon">${t.icon}</div>
        <div class="task-body">
          <div class="task-title">${t.title}</div>
          <div class="task-meta"><span>${t.meta}</span><span>•</span><span>${Components.wfChip(t.wf)}</span><span>•</span><span>${t.due.includes("Overdue")? Components.chip("Overdue") : (t.due.includes("today")||t.due.includes("tomorrow")? Components.chip("Due") : t.due)}</span></div>
        </div>
        <div class="task-action"><button class="btn btn-sm" onclick="Toast.show('Opened: ${t.title.replace(/'/g,"")}', 'info')">Open</button></div>
      </div>
    `);
  },
  miniBarChartHTML(values, color){
    const max = Math.max(...values);
    const bars = values.map(v=>{
      const h = Math.round((v/max)*54)+6;
      return `<div style="flex:1;display:flex;align-items:flex-end;"><div style="width:100%;height:${h}px;background:${color};border-radius:4px 4px 0 0;"></div></div>`;
    }).join("");
    return `<div style="display:flex;gap:6px;height:64px;align-items:flex-end;">${bars}</div>`;
  },
  chartPanel(title, values, color){
    const p = document.createElement("div");
    p.className = "panel";
    p.innerHTML = `<div class="panel-header"><h3>${title}</h3></div><div class="panel-body">${this.miniBarChartHTML(values,color)}</div>`;
    return p;
  },
  masterTable({columns, rows, emptyText}){
    const wrap = document.createElement("div");
    let sortState = {col:null, dir:1};
    let filterText = "";

    function renderRows(){
      const tbody = wrap.querySelector("tbody");
      let data = rows.filter(r=> columns.some(c=> String(r[c.key]||"").toLowerCase().includes(filterText.toLowerCase())));
      if(sortState.col){
        data = data.slice().sort((a,b)=>{
          const av=a[sortState.col], bv=b[sortState.col];
          return av>bv? sortState.dir : av<bv? -sortState.dir : 0;
        });
      }
      tbody.innerHTML = "";
      if(data.length===0){
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="${columns.length}"><div class="table-empty">${emptyText||"No records found."}</div></td>`;
        tbody.appendChild(tr);
      } else {
        data.forEach(r=>{
          const tr = document.createElement("tr");
          tr.innerHTML = columns.map(c=>`<td data-label="${c.label}">${c.render? c.render(r) : (r[c.key]??"")}</td>`).join("");
          tbody.appendChild(tr);
        });
      }
      wrap.querySelector(".table-footer .count").textContent = data.length + " of " + rows.length + " records";
    }

    wrap.className = "panel";
    wrap.innerHTML = `
      <div class="table-toolbar">
        <input type="text" placeholder="Search / filter…">
        <select><option>All</option></select>
      </div>
      <div class="panel-body no-pad">
        <table class="mtable">
          <thead><tr>${columns.map(c=>`<th data-key="${c.key}">${c.label}</th>`).join("")}</tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="table-footer"><span class="count"></span><span>Page 1 of 1</span></div>
    `;
    wrap.querySelector("input[type=text]").addEventListener("input", (e)=>{ filterText=e.target.value; renderRows(); });
    wrap.querySelectorAll("th").forEach(th=>{
      th.addEventListener("click", ()=>{
        const key = th.dataset.key;
        sortState.dir = (sortState.col===key)? -sortState.dir : 1;
        sortState.col = key;
        renderRows();
      });
    });
    renderRows();
    return wrap;
  },
  // last-updated + freshness cell used across master tables
  lastUpdatedCell(rec, cadenceDays){
    const overdue = Store.freshnessDaysOverdue(rec, cadenceDays);
    return `<div style="display:flex;align-items:center;gap:8px;"><span style="font-size:11.5px;color:var(--gray-600);">${rec.lastUpdated||"—"}</span>${this.freshnessDot(overdue)}</div>`;
  },
  /* UploadWithPreview — template → parse preview → row-level error log → commit.
     onCommit(validRows) is called only for rows without errors.
     Simulated parse: generates seed-like rows, injecting a couple of errors. */
  uploadWithPreview({entityLabel, columns, sampleRows, onCommit}){
    const wrap = document.createElement("div");
    let step = 1; // 1 choose, 2 preview, 3 committed
    let parsed = [];

    function stepper(){
      return `<div class="upload-steps">
        <div class="step ${step>=1?(step>1?'done':'active'):''}">1 · Choose template</div>
        <div class="step ${step===2?'active':(step>2?'done':'')}">2 · Parse & preview</div>
        <div class="step ${step===3?'done':''}">3 · Commit</div>
      </div>`;
    }
    function render(){
      let body = "";
      if(step===1){
        body = `
          <div class="upload-drop" id="mu-drop">
            <div class="icon">📄</div>
            <div><b>Drop the ${entityLabel} mass-upload template here</b></div>
            <div class="text-muted" style="margin:6px 0 14px;">.xlsx template — or use the sample below.</div>
            <button class="btn btn-primary" id="mu-parse">Parse sample ${entityLabel} file</button>
          </div>`;
      } else if(step===2){
        const errCount = parsed.filter(r=>r.__error).length;
        body = `
          <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
            <span class="chip chip-blue"><span class="chip-dot"></span>${parsed.length} rows parsed</span>
            <span class="chip chip-green"><span class="chip-dot"></span>${parsed.length-errCount} valid</span>
            <span class="chip ${errCount?'chip-red':'chip-gray'}"><span class="chip-dot"></span>${errCount} error${errCount!==1?'s':''}</span>
          </div>
          <div class="panel-body no-pad" style="border:1px solid var(--gray-200);border-radius:8px;overflow:auto;max-height:300px;">
            <table class="mtable"><thead><tr><th>Row</th>${columns.map(c=>`<th>${c.label}</th>`).join("")}<th>Status</th></tr></thead>
            <tbody>${parsed.map((r,i)=>`<tr style="${r.__error?'background:#FBEAE8;':''}">
              <td data-label="Row">${i+1}</td>
              ${columns.map(c=>`<td data-label="${c.label}">${r[c.key]??""}</td>`).join("")}
              <td data-label="Status">${r.__error? `<span class="chip chip-red"><span class="chip-dot"></span>${r.__error}</span>` : Components.chip("Fresh")}</td>
            </tr>`).join("")}</tbody></table>
          </div>
          ${errCount? `<div class="text-muted" style="margin-top:10px;font-size:12px;">⚠️ ${errCount} row(s) with errors will be skipped on commit. Fix the source file to include them.</div>`:""}
          <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;">
            <button class="btn" id="mu-back">Back</button>
            <button class="btn btn-primary" id="mu-commit">Commit ${parsed.length-errCount} valid row(s)</button>
          </div>`;
      } else {
        const committed = parsed.filter(r=>!r.__error).length;
        body = `<div class="coming-soon" style="border-color:var(--green);"><div class="cs-icon">✅</div>
          <div class="cs-title">${committed} ${entityLabel} record(s) committed</div>
          <div class="text-muted">Audit entries written; freshness reset to today.</div>
          <button class="btn btn-primary" id="mu-again" style="margin-top:14px;">Upload another file</button></div>`;
      }
      wrap.innerHTML = stepper() + body;
      bind();
    }
    function bind(){
      const q = id=>wrap.querySelector(id);
      if(step===1) q("#mu-parse").onclick = ()=>{ parsed = sampleRows(); step=2; render(); };
      if(step===2){
        q("#mu-back").onclick = ()=>{ step=1; render(); };
        q("#mu-commit").onclick = ()=>{
          const valid = parsed.filter(r=>!r.__error);
          onCommit(valid);
          step=3; render();
        };
      }
      if(step===3) q("#mu-again").onclick = ()=>{ step=1; parsed=[]; render(); };
    }
    render();
    return wrap;
  },
  /* Effective-date timeline for a record with history[] */
  effectiveTimeline(entity, uom){
    const rows = entity.history.slice().sort((a,b)=> new Date(a.effectiveFrom)-new Date(b.effectiveFrom));
    const current = Store.currentValue(entity);
    const list = rows.map((h,i)=>{
      const isCurrent = (i===rows.length-1);
      return `<li class="${isCurrent?'current':'done'}">
        <div class="tl-dot">${isCurrent?'●':'✓'}</div>
        <div class="tl-body">
          <div class="tl-title">${h.value} ${uom||""} ${isCurrent?'<span class="chip chip-blue" style="margin-left:6px;"><span class="chip-dot"></span>current</span>':''}</div>
          <div class="tl-meta">Effective from ${h.effectiveFrom} • source: ${h.source||"—"}</div>
        </div></li>`;
    }).join("");
    const el = document.createElement("div");
    el.innerHTML = `<div class="text-muted" style="font-size:12px;margin-bottom:10px;">Value valid today (${TODAY}): <b>${current} ${uom||""}</b></div><ul class="timeline">${list}</ul>`;
    return el;
  },
  comingSoon(title, screenId){
    const wrap = document.createElement("div");
    wrap.appendChild(this.pageHeader(title));
    wrap.appendChild(this.el(`
      <div class="coming-soon">
        <div class="cs-icon">🧩</div>
        <div class="cs-title">${title}</div>
        <div class="text-muted">This screen is already wired into navigation and role-based access. Its full functionality is planned for an upcoming release.</div>
        <div class="cs-epic">Planned</div>
      </div>
    `));
    return wrap;
  }
};

      luCol,{key:"__tl",label:"",render:r=>`<button class="btn btn-sm" data-tlid="${r.id}">Timeline</button>`},editCol];
    rows=DATA.commodities;
  } else if(tab.id==="fx"){
    columns=[{key:"project",label:"Project"},{key:"sourcingNo",label:"Sourcing"},{key:"currency",label:"Currency"},
      {key:"__cur",label:"Current rate",render:r=>`<b>${Store.currentValue(r)}</b>`},

  });

/* ---- Drawer: create / edit a master record ---- */
function openMasterDrawer(tab, rec){
  const isNew = !rec;
  const g = (k,d="")=> rec? (rec[k]??d) : d;
  let fields = "";
  const inp = (label,id,val,type="text")=>`<div class="form-row"><label>${label}</label><input id="mf-${id}" type="${type}" value="${val??""}"></div>`;
  const sel = (label,id,val,opts)=>`<div class="form-row"><label>${label}</label><select id="mf-${id}">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join("")}</select></div>`;

  if(tab.id==="project"){
    fields = inp("Project code","code",g("code"))+inp("Name","name",g("name"))+
      sel("Brand","brand",g("brand"),["VW","Skoda","Audi","Seat","Porsche"])+
      inp("Sourcing nos (F../G..)","sourcingNos",g("sourcingNos"))+
      sel("Status","status",g("status","Planning"),["Planning","Active","Closed"])+
      inp("SOP date","sop",g("sop"),"date");
  } else if(tab.id==="part"){
    fields = inp("Part no.","number",g("number"))+inp("Designation","designation",g("designation"))+
      sel("Type","type",g("type","Single part"),["Assembly","Single part","Fakum/Colour"])+
      sel("Project","project",g("project"),DATA.projects.map(p=>p.code))+
      sel("Commodity","commodity",g("commodity"),["Steel","Aluminium","Copper","Polymer","Fastener"])+
      sel("Supplier","supplier",g("supplier"),DATA.suppliers.map(s=>s.name))+
      inp("Unit of quantity","uoQ",g("uoQ","PCE"));
  } else if(tab.id==="supplier"){
    fields = inp("DUNS no.","duns",g("duns"))+inp("Name","name",g("name"))+
      inp("Country","country",g("country"))+inp("Place","place",g("place"))+
      sel("Commodity","commodity",g("commodity"),["Steel","Aluminium","Copper","Polymer","Fastener"])+
      inp("Business share","businessShare",g("businessShare"))+
      sel("Risk rating","riskRating",g("riskRating","Low"),["Low","Medium","High"]);
  } else if(tab.id==="milestone"){
    fields = sel("Project","project",g("project"),DATA.projects.map(p=>p.code))+
      sel("Milestone","name",g("name","B-Release"),["B-Release","P-Frei","VFF","PVS","0-Series","PPAP","SOP"])+
      inp("Plan date","planDate",g("planDate"),"date");
  } else if(tab.id==="volume"){
    fields = sel("Project","project",g("project"),DATA.projects.map(p=>p.code))+
      inp("Model","model",g("model"))+inp("Year","year",g("year"),"number")+
      inp("Volume","volume",g("volume"),"number")+sel("Uploaded by","uploadedBy",g("uploadedBy","B"),["B","Z"])+
      inp("Effective from","effectiveFrom",g("effectiveFrom"),"date");
  } else if(tab.id==="commodity"||tab.id==="fx"||tab.id==="ekl"){
    // effective-dated: adding a record adds/starts a history entry
    const head = tab.id==="commodity"? inp("Code","code",g("code"))+inp("Name","name",g("name"))+inp("UoM","uom",g("uom","INR/kg"))
      : tab.id==="fx"? sel("Project","project",g("project"),DATA.projects.map(p=>p.code))+inp("Sourcing no.","sourcingNo",g("sourcingNo"))+sel("Currency","currency",g("currency","EUR"),["EUR","USD","CNY","GBP"])
      : sel("Project","project",g("project"),DATA.projects.map(p=>p.code))+inp("Part","part",g("part"))+inp("UoM","uom",g("uom","INR"));
    fields = head +
      `<div style="border-top:1px solid var(--gray-100);margin:8px 0 14px;"></div>
       <div class="text-muted" style="font-size:12px;margin-bottom:10px;">${isNew?'Set the first value':'Add a new effective-dated value (previous values are kept)'}</div>`+
      inp("New value","value","", "number")+
      inp("Effective from","effectiveFrom",TODAY,"date")+
      inp("Source","source","Manual entry");
  }

  Drawer.open((isNew?"New ":"Edit ")+tab.label, fields, ()=>{
    const v = id=>{ const e=document.getElementById("mf-"+id); return e? e.value : ""; };
    if(tab.id==="commodity"||tab.id==="fx"||tab.id==="ekl"){
      const list = tab.id==="commodity"?DATA.commodities:tab.id==="fx"?DATA.fx:DATA.eklTargets;
      let target = rec;
      if(isNew){
        target = tab.id==="commodity"? {id:"C"+(list.length+1),code:v("code"),name:v("name"),uom:v("uom"),history:[]}
          : tab.id==="fx"? {id:"FX"+(list.length+1),project:v("project"),sourcingNo:v("sourcingNo"),currency:v("currency"),history:[]}
          : {id:"E"+(list.length+1),project:v("project"),part:v("part"),uom:v("uom"),history:[]};
        list.push(target);
      }
      const newVal = parseFloat(v("value"));
      if(!isNaN(newVal)){
        target.history.push({effectiveFrom:v("effectiveFrom")||TODAY, value:newVal, source:v("source")||"Manual"});
        target.history.sort((a,b)=> new Date(a.effectiveFrom)-new Date(b.effectiveFrom));
      }
      Store.touch(target);
      Store.audit(tab.label, isNew?"create":"add effective value", target.code||target.currency||target.part);
    } else {
      const list = ({project:DATA.projects,part:DATA.parts,supplier:DATA.suppliers,milestone:DATA.milestones,volume:DATA.carVolumes})[tab.id];
      let target = rec;
      if(isNew){ target = {id:tab.id.toUpperCase()+(list.length+1)}; list.push(target); }
      const map = {
        project:["code","name","brand","sourcingNos","status","sop"],
        part:["number","designation","type","project","commodity","supplier","uoQ"],
        supplier:["duns","name","country","place","commodity","businessShare","riskRating"],
        milestone:["project","name","planDate"],
        volume:["project","model","year","volume","uploadedBy","effectiveFrom"],
      }[tab.id];
      map.forEach(k=> target[k]=v(k));
      Store.touch(target);
      Store.audit(tab.label, isNew?"create":"update", target.number||target.code||target.name||target.id);
    }
    setTimeout(()=>Router.render(),50);
  });
}

  };
  const target = {part:DATA.parts,supplier:DATA.suppliers,volume:DATA.carVolumes,milestone:DATA.milestones}[tab.id];

  const comp = Components.uploadWithPreview({
    entityLabel: tab.label,
    columns: cols[tab.id],
    sampleRows: samplers[tab.id],
    onCommit:(valid)=>{
      valid.forEach((r,i)=>{
        const rec = {...r, id:tab.id.toUpperCase()+"U"+(target.length+i+1), lastUpdated:TODAY};
        delete rec.__error;
        target.push(rec);
      });

      Toast.show(`${valid.length} ${tab.label} record(s) committed via mass upload.`, "success");

  });
  Drawer.open("Mass upload — "+tab.label, "", null);
  document.getElementById("drawer-body").innerHTML="";

}

<script>

/* ---------------------------------------------------------

--------------------------------------------------------- */
DATA.sourcingRecords = [];      // decided-sourcing records
DATA.dataInventoryDate = null;  // recorded on each import
DATA.cbds = {};                 // partNumber -> CostBreakdown
DATA.priceVersions = {};        // partNumber -> [PriceVersion] — never overwritten
DATA.investments = {};          // partNumber -> Investment

// Commodity name -> master record id (for weight-driven raw-material value)
const COMMODITY_OF = {Steel:"C1", Aluminium:"C2", Copper:"C3", Lead:"C4", Precious:"C5", Polymer:null, Fastener:null};
const COUNTRIES = ["India","Germany","China","Sweden","Poland","Czechia","Thailand"];

function commodityPrice(name){
  const id = COMMODITY_OF[name];
  const rec = id && DATA.commodities.find(c=>c.id===id);
  return rec ? (Store.currentValue(rec)||0) : 0;
}
function partByNumber(no){ return DATA.parts.find(p=>p.number===no); }
function fmt(n){ return (Math.round((+n||0)*100)/100).toLocaleString("en-IN"); }
function projectBrand(code){ const p=DATA.projects.find(x=>x.code===code || code?.startsWith(x.code)); return p?p.brand:"—"; }

/* ---- CBD math (single source of truth for the rollup) ---- */
function rawMaterialValue(cbd){
  const w = cbd.weights;
  return (w.steel.net*commodityPrice("Steel"))
       + (w.aluminium.net*commodityPrice("Aluminium"))
       + (w.copper.net*commodityPrice("Copper"))
       + (w.lead.net*commodityPrice("Lead"))
       + (w.precious.net*commodityPrice("Precious"));
}
function importValue(cbd){ return (cbd.importContent.value||0) * (cbd.importContent.fxRate||0); }
function manualNodesTotal(cbd){ return cbd.tree.filter(n=>!n.derived).reduce((s,n)=>s+(+n.cost||0),0); }
function cbdPartCost(cbd){ return rawMaterialValue(cbd) + importValue(cbd) + manualNodesTotal(cbd); }
function cbdCarCost(cbd){ return cbdPartCost(cbd)*(cbd.qtyPerCar||1) + (cbd.dd.amortPerCar||0); }

/* Rebuild the two derived tree nodes so the tree total always
   reflects current weights + FX. */
function syncDerivedNodes(cbd){
  cbd.tree = cbd.tree.filter(n=>!n.derived);
  cbd.tree.unshift(
    {id:"D-RAW", derived:true, level:0, name:"Raw material (from weights × commodity price)", cost:rawMaterialValue(cbd)},
    {id:"D-IMP", derived:true, level:0, name:"Import content (value × FX)", cost:importValue(cbd)}
  );
}

function commitImport(parsed, inventoryDate){
  DATA.dataInventoryDate = inventoryDate;
  let created=0, updated=0, newTasks=0;
  parsed.filter(r=>r.__op!=="error").forEach((r,idx)=>{
    // --- master upserts ---
    // project
    if(r.project && !DATA.projects.find(p=>p.code===r.project)){
      DATA.projects.push({id:"P"+(DATA.projects.length+1), code:r.project, name:r.project+" programme",
        brand:r.project.slice(0,2), status:"Active", sop:r.sopDate||"", lastUpdated:TODAY});
    }
    // supplier (keyed by DUNS)
    if(r.supplierDuns && !DATA.suppliers.find(s=>s.duns===r.supplierDuns)){
      DATA.suppliers.push({id:"S"+(DATA.suppliers.length+1), duns:r.supplierDuns, name:r.supplierName,
        country:r.country, place:r.place, plant:r.plant, commodity:r.commodity, businessShare:r.quota+"%",
        riskRating:"Low", lastUpdated:TODAY});
    }
    // part (keyed by part number)
    let part = partByNumber(r.partNumber);
    const isUpdate = !!part;
    if(!part){
      part = {id:"PT"+(DATA.parts.length+1), number:r.partNumber, designation:r.partDesignation, type:"Single part",
        project:r.project, commodity:r.commodity, supplier:r.supplierName, uoQ:"PCE", status:"Due", lastUpdated:TODAY};
      DATA.parts.push(part);
    } else {
      part.supplier = r.supplierName; part.project = r.project; Store.touch(part);
    }
    // sourcing record
    DATA.sourcingRecords.push({
      id:"SR"+(DATA.sourcingRecords.length+1), brand:r.brand, com:r.com, processNo:r.processNo, sourcingNo:r.sourcingNo,
      partNumber:r.partNumber, partDesignation:r.partDesignation, partType:r.partType||"-", materialGroup:r.materialGroup,
      commodity:r.commodity, project:r.project, supplierDuns:r.supplierDuns, supplierName:r.supplierName,
      country:r.country, place:r.place, plant:r.plant, quota:r.quota, decisionDate:r.decisionDate, sopDate:r.sopDate,
      aPrice:r.aPrice, currency:r.currency, dataInventoryDate:inventoryDate, lastUpdated:TODAY,
    });
    isUpdate? updated++ : created++;

    // --- fill-your-details tasks routed by responsibility ---
    if(!isUpdate){
      const routing = [
        {role:"buyer", icon:"\u{1F4E5}", what:"qty/car, CBD, weights, import content, VSI, Target, D&D"},
        {role:"pm",    icon:"\u{1F4CC}", what:"confirm project & car-volume linkage"},
        {role:"srm",   icon:"\u{1F6E0}", what:"open tooling / readiness record"},
      ];
      routing.forEach(rt=>{
        DATA.tasks.unshift({icon:rt.icon, title:`Fill your details \u2014 ${r.partDesignation}`, meta:`Sourcing import \u2022 ${rt.what}`,
          role:rt.role, due:"Due in 2d", wf:r.sourcingNo.replace(/\s+/g,"")});
        newTasks++;
      });
    }
  });
  Store.audit("Sourcing Report", "import commit", `${created} created, ${updated} updated, inv ${inventoryDate}`);
  Notif.updateBadge();
  Toast.show(`Import committed: ${created} created, ${updated} updated \u2022 ${newTasks} fill-details tasks routed.`, "success");
}

function buildSourcingRecords(){

    (!SR_FILTER.commodity || r.commodity===SR_FILTER.commodity) &&
    (!SR_FILTER.plant || r.plant===SR_FILTER.plant));

  const table = Components.masterTable({
    columns:[
      {key:"sourcingNo",label:"Sourcing no."},
      {key:"partNumber",label:"Part no."},
      {key:"partDesignation",label:"Designation"},
      {key:"__brand",label:"Brand",render:r=>`<span style="font-weight:600;">${projectBrand(r.project)}</span>`},
      {key:"commodity",label:"Commodity"},
      {key:"project",label:"Project"},
      {key:"supplierName",label:"Supplier"},
      {key:"plant",label:"Plant"},
      {key:"aPrice",label:"A-Price",render:r=>r.aPrice!=null?`${r.aPrice} ${r.currency}`:"\u2014"},
      {key:"__go",label:"",render:r=>`<button class="btn btn-sm" data-part="${r.partNumber}">Open part \u2192</button>`},
    ],
    rows, emptyText:"No records match the current filters."
  });
  table.addEventListener("click",e=>{
    const b=e.target.closest("[data-part]"); if(b) openPartDrawer(b.dataset.part);
  });
  wrap.appendChild(table);
  return wrap;
}

/* Part drill-down drawer — links to CBD / Price / Investment */
function openPartDrawer(partNumber){
  const part = partByNumber(partNumber);
  const sr = DATA.sourcingRecords.find(s=>s.partNumber===partNumber);
  const hasCbd = !!DATA.cbds[partNumber];
  const name = part? part.designation : (sr? sr.partDesignation : partNumber);
  const rows = [
    ["Part number", partNumber],
    ["Designation", name],
    ["Project", part?.project || sr?.project || "\u2014"],
    ["Commodity", part?.commodity || sr?.commodity || "\u2014"],
    ["Supplier", part?.supplier || sr?.supplierName || "\u2014"],
    ["Plant", sr?.plant || "\u2014"],
    ["A-Price", sr? (sr.aPrice!=null? sr.aPrice+" "+sr.currency:"\u2014"):"\u2014"],
    ["CBD", hasCbd? "\u2705 built" : "\u2014 not yet built"],
  ];
  const info = rows.map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100);"><span class="text-muted">${k}</span><b>${v}</b></div>`).join("");
  Drawer.open(name, `<div>${info}</div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="Drawer.close();CBD_ACTIVE='${partNumber}';Router.go('cbd-tree','procurement')">Open CBD tree</button>
      <button class="btn" onclick="Drawer.close();PRICE_ACTIVE='${partNumber}';Router.go('price-history','procurement')">Price history</button>
      <button class="btn" onclick="Drawer.close();INV_ACTIVE='${partNumber}';Router.go('investment','procurement')">Investment</button>
    </div>`, null);
  document.querySelector("#drawer .drawer-footer").style.display="none";
}

/* =============================================================
   COST BREAKDOWN (CBD) CHILD-PART TREE
============================================================= */
let CBD_ACTIVE = null;
let CBD_RECALC = false; // triggers the recalculation banner after a change

function cbdPartOptions(){
  const nums = Object.keys(DATA.cbds);
  DATA.parts.forEach(p=>{ if(!nums.includes(p.number)) nums.push(p.number); });
  return nums;
}
function ensureCbd(partNumber){
  if(DATA.cbds[partNumber]) return DATA.cbds[partNumber];
  const part = partByNumber(partNumber);
  const cbd = {
    part:part?part.designation:partNumber, partNumber, project:part?.project||"", currency:"INR", qtyPerCar:1,
    weights:{steel:{grade:"",supplier:part?.supplier||"",gross:0,net:0},aluminium:{gross:0,net:0},
      copper:{gross:0,net:0},lead:{gross:0,net:0},precious:{gross:0,net:0}},
    importContent:{value:0,fxRate:91.4,currency:"EUR",origin:"India"},
    vsiOriginal:0, targetOriginal:0, dd:{amortPerCar:0,volume:0}, tree:[], lastUpdated:TODAY,
  };
  syncDerivedNodes(cbd);
  DATA.cbds[partNumber]=cbd;
  return cbd;
}

function buildCbdTree(){
  const wrap = document.createElement("div");
  const canWrite = RBAC.canWrite("part") || RBAC.canWrite("material-cost-dash") || RBAC.role==="buyer" || RBAC.role==="finance";
  wrap.appendChild(Components.pageHeader("Cost Breakdown (CBD)",
    "Editable child-part cost tree per part. Weights, import content and FX feed the tree total live; any change re-rolls the material cost to car level."));

  const parts = cbdPartOptions();
  if(!CBD_ACTIVE || !parts.includes(CBD_ACTIVE)) CBD_ACTIVE = parts[0];
  const cbd = ensureCbd(CBD_ACTIVE);
  syncDerivedNodes(cbd);

  // part picker + upload
  const bar = document.createElement("div");
  bar.style.cssText="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;";
  const picker = document.createElement("select");
  picker.style.cssText="padding:8px 12px;border:1px solid var(--gray-200);border-radius:8px;font-size:13px;background:#fff;min-width:260px;";
  picker.innerHTML = parts.map(n=>{ const p=partByNumber(n); const lbl=p?`${p.designation} (${n})`:n; return `<option value="${n}" ${n===CBD_ACTIVE?'selected':''}>${lbl}</option>`; }).join("");
  picker.onchange=()=>{ CBD_ACTIVE=picker.value; CBD_RECALC=false; Router.render(); };
  bar.appendChild(Components.el(`<span class="text-muted" style="font-size:12px;">Part</span>`));
  bar.appendChild(picker);
  if(canWrite){
    const up = document.createElement("button"); up.className="btn"; up.textContent="\u2B06\uFE0F Mass-upload CBD";
    up.onclick=()=>openCbdUpload(cbd); bar.appendChild(up);
  }
  wrap.appendChild(bar);

  // recalculation banner
  if(CBD_RECALC){
    wrap.appendChild(Components.el(`<div class="panel" style="border-left:4px solid var(--amber);margin-bottom:14px;">
      <div class="panel-body" style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:18px;">\u{1F504}</span>
        <div><b>Recalculated.</b> <span class="text-muted">A weight, FX or node change propagated through the tree total and the material-cost rollup.</span></div>
      </div></div>`));
  }

  // rollup KPIs
  const kpis = document.createElement("div"); kpis.className="grid grid-4";
  kpis.appendChild(Components.kpiCard("Tree total (part)", "\u20B9 "+fmt(cbdPartCost(cbd)), null, "\u{1F333}"));
  kpis.appendChild(Components.kpiCard("Qty / car", cbd.qtyPerCar, null, "\u{1F697}"));
  kpis.appendChild(Components.kpiCard("Material cost / car", "\u20B9 "+fmt(cbdCarCost(cbd)), null, "\u{1F4C8}"));
  const varVsTgt = cbd.targetOriginal? ((cbdPartCost(cbd)-cbd.targetOriginal)/cbd.targetOriginal*100):0;
  kpis.appendChild(Components.kpiCard("Variance vs Target", (varVsTgt>=0?"+":"")+varVsTgt.toFixed(1)+"%",
    {dir:varVsTgt>0?"up":"down", text:varVsTgt>0?"over target":"within target"}, "\u{1F3AF}"));
  wrap.appendChild(kpis);

  // main grid: tree + capture panels
  const grid = document.createElement("div"); grid.className="grid grid-2"; grid.style.marginTop="16px";

  // --- tree panel ---
  const treePanel = document.createElement("div"); treePanel.className="panel";
  treePanel.innerHTML = `<div class="panel-header"><h3>Child-part cost tree <span class="count-pill">${cbd.tree.length}</span></h3>
    ${canWrite?`<button class="btn btn-sm btn-primary" id="cbd-addnode">+ Node</button>`:""}</div>`;
  const tbody = document.createElement("div"); tbody.className="panel-body no-pad";
  tbody.innerHTML = `<table class="mtable"><thead><tr><th>Node</th><th>Level</th><th>Cost (\u20B9)</th><th></th></tr></thead>
    <tbody>${cbd.tree.map(n=>`<tr>
      <td data-label="Node"><span style="padding-left:${(n.level||0)*14}px;">${n.derived?"\u{1F517} ":""}${n.name}</span>${n.derived?` <span class="chip chip-gray" style="margin-left:6px;"><span class="chip-dot"></span>auto</span>`:""}</td>
      <td data-label="Level">${n.level||0}</td>
      <td data-label="Cost">${fmt(n.cost)}</td>
      <td data-label="">${(!n.derived && canWrite)?`<button class="btn btn-sm" data-edit="${n.id}">Edit</button> <button class="btn btn-sm" data-del="${n.id}">\u2715</button>`:""}</td>
    </tr>`).join("")}
    <tr style="background:var(--gray-50);font-weight:700;"><td>Tree total</td><td></td><td>${fmt(cbdPartCost(cbd))}</td><td></td></tr>
    </tbody></table>`;
  treePanel.appendChild(tbody);
  grid.appendChild(treePanel);

  // --- capture panel ---
  const cap = document.createElement("div"); cap.className="panel";
  cap.innerHTML = `<div class="panel-header"><h3>Cost inputs</h3>${canWrite?`<button class="btn btn-sm" id="cbd-edit-inputs">Edit inputs</button>`:""}</div>`;
  const w=cbd.weights;
  const line=(k,v)=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--gray-100);"><span class="text-muted">${k}</span><b>${v}</b></div>`;
  const cb=document.createElement("div"); cb.className="panel-body";
  cb.innerHTML =
    line("Quantity per car", cbd.qtyPerCar)+
    line("Steel", `${w.steel.grade||"\u2014"} \u2022 ${w.steel.supplier||"\u2014"} \u2022 gross ${w.steel.gross} / net ${w.steel.net} kg`)+
    line("Aluminium", `gross ${w.aluminium.gross} / net ${w.aluminium.net} kg`)+
    line("Copper", `gross ${w.copper.gross} / net ${w.copper.net} kg`)+
    line("Lead", `gross ${w.lead.gross} / net ${w.lead.net} kg`)+
    line("Precious", `gross ${w.precious.gross} / net ${w.precious.net} g`)+
    line("Import content", `${cbd.importContent.value} ${cbd.importContent.currency} \u2022 FX ${cbd.importContent.fxRate} \u2022 ${cbd.importContent.origin}`)+
    line("Raw-material value", "\u20B9 "+fmt(rawMaterialValue(cbd)))+
    line("Import value (\u00D7 FX)", "\u20B9 "+fmt(importValue(cbd)))+
    line("VSI (original)", "\u20B9 "+fmt(cbd.vsiOriginal))+
    line("Target (original)", "\u20B9 "+fmt(cbd.targetOriginal))+
    line("D&D amortisation / car", "\u20B9 "+fmt(cbd.dd.amortPerCar)+" @ vol "+fmt(cbd.dd.volume));
  cap.appendChild(cb);
  grid.appendChild(cap);
  wrap.appendChild(grid);

  // wire actions
  if(canWrite){
    treePanel.querySelector("#cbd-addnode").onclick=()=>openCbdNodeDrawer(cbd,null);
    tbody.addEventListener("click",e=>{
      const ed=e.target.closest("[data-edit]"); if(ed){ openCbdNodeDrawer(cbd, cbd.tree.find(n=>n.id===ed.dataset.edit)); return; }
      const dl=e.target.closest("[data-del]"); if(dl){ cbd.tree=cbd.tree.filter(n=>n.id!==dl.dataset.del); afterCbdChange(cbd,"delete node"); }
    });
    cap.querySelector("#cbd-edit-inputs").onclick=()=>openCbdInputsDrawer(cbd);
  }
  return wrap;
}

function afterCbdChange(cbd, action){
  syncDerivedNodes(cbd);
  Store.touch(cbd);
  // a CBD recompute appends a price version (never overwrite)
  const list = DATA.priceVersions[cbd.partNumber] || (DATA.priceVersions[cbd.partNumber]=[]);
  list.push({price:Math.round(cbdPartCost(cbd)), vsi:cbd.vsiOriginal, target:cbd.targetOriginal,
    effectiveFrom:TODAY, source:"CBD recalculation ("+action+")", changeReq:null});
  Store.audit("CBD", action, cbd.part);
  CBD_RECALC = true;
  Router.render();
}

function openCbdNodeDrawer(cbd, node){
  const isNew=!node;
  const g=(k,d="")=>node?(node[k]??d):d;
  Drawer.open((isNew?"Add ":"Edit ")+"cost node",
    `<div class="form-row"><label>Node name</label><input id="nd-name" value="${g("name")}"></div>
     <div class="form-row"><label>Level (0 = top)</label><input id="nd-level" type="number" min="0" value="${g("level",1)}"></div>
     <div class="form-row"><label>Cost (\u20B9)</label><input id="nd-cost" type="number" step="0.01" value="${g("cost",0)}"></div>
     <div class="hint">Manual nodes add to the two auto nodes (raw material, import content).</div>`,
    ()=>{
      const name=document.getElementById("nd-name").value||"Unnamed";
      const level=parseInt(document.getElementById("nd-level").value)||0;
      const cost=parseFloat(document.getElementById("nd-cost").value)||0;
      if(isNew) cbd.tree.push({id:"N"+Date.now(), derived:false, name, level, cost});
      else { node.name=name; node.level=level; node.cost=cost; }
      afterCbdChange(cbd, isNew?"add node":"edit node");
    });
}

function openCbdInputsDrawer(cbd){
  const w=cbd.weights, ic=cbd.importContent;
  const row=(l,id,v,type="number",step="0.01")=>`<div class="form-row"><label>${l}</label><input id="ci-${id}" type="${type}" ${type==='number'?`step="${step}"`:""} value="${v??""}"></div>`;
  Drawer.open("Edit cost inputs",
    row("Quantity per car","qty",cbd.qtyPerCar,"number","1")+
    `<div style="font-weight:700;color:var(--gray-600);font-size:12px;margin:6px 0;">Steel</div>`+
    row("Grade","s_grade",w.steel.grade,"text")+row("Supplier","s_sup",w.steel.supplier,"text")+
    row("Gross (kg)","s_g",w.steel.gross)+row("Net (kg)","s_n",w.steel.net)+
    `<div style="font-weight:700;color:var(--gray-600);font-size:12px;margin:6px 0;">Aluminium / Copper / Lead / Precious</div>`+
    row("Aluminium net (kg)","a_n",w.aluminium.net)+row("Copper net (kg)","c_n",w.copper.net)+
    row("Lead net (kg)","l_n",w.lead.net)+row("Precious net (g)","p_n",w.precious.net)+
    `<div style="font-weight:700;color:var(--gray-600);font-size:12px;margin:6px 0;">Import content &amp; FX</div>`+
    row("Import value","ic_v",ic.value)+row("FX rate","ic_fx",ic.fxRate)+row("Origin country","ic_o",ic.origin,"text")+
    `<div style="font-weight:700;color:var(--gray-600);font-size:12px;margin:6px 0;">Baselines &amp; D&amp;D</div>`+
    row("VSI (original)","vsi",cbd.vsiOriginal)+row("Target (original)","tgt",cbd.targetOriginal)+
    row("D&D amort / car","dd_a",cbd.dd.amortPerCar)+row("D&D volume","dd_v",cbd.dd.volume,"number","1"),
    ()=>{
      const v=id=>parseFloat(document.getElementById("ci-"+id).value)||0;
      const t=id=>document.getElementById("ci-"+id).value;
      cbd.qtyPerCar=v("qty");
      w.steel.grade=t("s_grade"); w.steel.supplier=t("s_sup"); w.steel.gross=v("s_g"); w.steel.net=v("s_n");
      w.aluminium.net=v("a_n"); w.copper.net=v("c_n"); w.lead.net=v("l_n"); w.precious.net=v("p_n");
      ic.value=v("ic_v"); ic.fxRate=v("ic_fx"); ic.origin=t("ic_o");
      cbd.vsiOriginal=v("vsi"); cbd.targetOriginal=v("tgt"); cbd.dd.amortPerCar=v("dd_a"); cbd.dd.volume=v("dd_v");
      afterCbdChange(cbd, "edit inputs (weights/FX)");
    });
}

/* Two mass-upload CBD formats */
function openCbdUpload(cbd){
  Drawer.open("Mass-upload CBD",
    `<div class="text-muted" style="font-size:12.5px;margin-bottom:12px;">Two CBD upload formats are supported. Pick a layout to parse a sample into this part's tree &amp; inputs.</div>
     <div class="form-row"><label>Format</label>
       <select id="cbdfmt"><option value="wide">Format A \u2014 wide (one row per part, columns = nodes + weights)</option>
       <option value="long">Format B \u2014 long (one row per cost node)</option></select></div>
     <div class="upload-drop" style="margin-top:8px;"><div class="icon">\u{1F4C4}</div><div><b>Drop CBD template</b></div>
       <div class="text-muted" style="font-size:12px;margin-top:4px;">or parse the built-in sample below</div></div>`,
    ()=>{
      const fmt=document.getElementById("cbdfmt").value;
      // simulate a parsed CBD: replace manual nodes + bump weights
      cbd.tree = cbd.tree.filter(n=>n.derived).concat(
        fmt==="wide"
          ? [{id:"U1",derived:false,level:1,name:"Sub-assembly A",cost:74},{id:"U2",derived:false,level:1,name:"Sub-assembly B",cost:39}]
          : [{id:"U1",derived:false,level:1,name:"Casting",cost:52},{id:"U2",derived:false,level:2,name:"Machining",cost:33},{id:"U3",derived:false,level:2,name:"Coating",cost:18}]
      );
      cbd.weights.steel.net = cbd.weights.steel.net || 1.4;
      afterCbdChange(cbd, "mass-upload ("+fmt+")");
      Toast.show(`CBD mass-upload parsed (${fmt==="wide"?"Format A":"Format B"}) \u2014 tree recalculated.`, "success");
    });
}

/* =============================================================
   PRICE HISTORY  (versioned, never overwritten)
============================================================= */
let PRICE_ACTIVE = null;

function priceParts(){ return Object.keys(DATA.priceVersions); }

function buildPriceHistory(){
  const wrap = document.createElement("div");
  const canWrite = RBAC.role==="buyer" || RBAC.role==="finance" || RBAC.canWrite("*");
  wrap.appendChild(Components.pageHeader("Price History",
    "Every price change appends a new version \u2014 never an overwrite. Old values stay visible; variance is charted against the original VSI &amp; Target."));

  const parts = priceParts();
  if(parts.length===0){ wrap.appendChild(Components.el(`<div class="coming-soon"><div class="cs-icon">\u{1F4C9}</div><div class="cs-title">No priced parts yet</div><div class="text-muted">Build a CBD or record a price to start a version history.</div></div>`)); return wrap; }
  if(!PRICE_ACTIVE || !parts.includes(PRICE_ACTIVE)) PRICE_ACTIVE = parts[0];
  const versions = DATA.priceVersions[PRICE_ACTIVE].slice().sort((a,b)=>new Date(a.effectiveFrom)-new Date(b.effectiveFrom));
  const part = partByNumber(PRICE_ACTIVE);

  const bar=document.createElement("div"); bar.style.cssText="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;";
  const picker=document.createElement("select");
  picker.style.cssText="padding:8px 12px;border:1px solid var(--gray-200);border-radius:8px;font-size:13px;background:#fff;min-width:260px;";
  picker.innerHTML=parts.map(n=>{const p=partByNumber(n);return `<option value="${n}" ${n===PRICE_ACTIVE?'selected':''}>${p?p.designation+" ("+n+")":n}</option>`;}).join("");
  picker.onchange=()=>{PRICE_ACTIVE=picker.value;Router.render();};
  bar.appendChild(Components.el(`<span class="text-muted" style="font-size:12px;">Part</span>`));
  bar.appendChild(picker);
  if(canWrite){ const b=document.createElement("button"); b.className="btn btn-primary"; b.textContent="+ Record price change"; b.onclick=()=>openPriceDrawer(PRICE_ACTIVE); bar.appendChild(b); }
  wrap.appendChild(bar);

  const latest=versions[versions.length-1];
  const vsi=latest.vsi, tgt=latest.target;
  const varVsi = vsi? ((latest.price-vsi)/vsi*100):0;
  const varTgt = tgt? ((latest.price-tgt)/tgt*100):0;

  const kpis=document.createElement("div"); kpis.className="grid grid-4";
  kpis.appendChild(Components.kpiCard("Current price","\u20B9 "+fmt(latest.price),null,"\u{1F4B0}"));
  kpis.appendChild(Components.kpiCard("Versions",versions.length,null,"\u{1F553}"));
  kpis.appendChild(Components.kpiCard("Variance vs VSI",(varVsi>=0?"+":"")+varVsi.toFixed(1)+"%",{dir:varVsi>0?"up":"down",text:"VSI \u20B9"+fmt(vsi)},"\u{1F3AF}"));
  kpis.appendChild(Components.kpiCard("Variance vs Target",(varTgt>=0?"+":"")+varTgt.toFixed(1)+"%",{dir:varTgt>0?"up":"down",text:"Target \u20B9"+fmt(tgt)},"\u{1F3AF}"));
  wrap.appendChild(kpis);

  const grid=document.createElement("div"); grid.className="grid grid-2"; grid.style.marginTop="16px";

  // variance chart vs VSI/Target
  const chart=document.createElement("div"); chart.className="panel";
  chart.innerHTML=`<div class="panel-header"><h3>Price movement vs VSI / Target</h3></div>`;
  const cbody=document.createElement("div"); cbody.className="panel-body";
  const prices=versions.map(v=>v.price);
  const max=Math.max(...prices, vsi||0, tgt||0)*1.05;
  const H=150;
  const bars=versions.map(v=>{
    const h=Math.round((v.price/max)*H)+4;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <div style="font-size:10.5px;font-weight:700;color:var(--navy);">\u20B9${fmt(v.price)}</div>
      <div style="width:60%;height:${h}px;background:var(--blue);border-radius:4px 4px 0 0;"></div>
      <div style="font-size:10px;color:var(--gray-600);text-align:center;">${v.effectiveFrom.slice(5)}</div></div>`;
  }).join("");
  const vsiY=vsi?Math.round((vsi/max)*H)+4:0, tgtY=tgt?Math.round((tgt/max)*H)+4:0;
  cbody.innerHTML=`<div style="position:relative;height:${H+30}px;display:flex;gap:8px;align-items:flex-end;padding-top:8px;">
    ${bars}
    ${vsi?`<div title="VSI" style="position:absolute;left:0;right:0;bottom:${vsiY+22}px;border-top:2px dashed var(--amber);"></div><span style="position:absolute;right:0;bottom:${vsiY+24}px;font-size:10px;color:var(--amber);font-weight:700;">VSI \u20B9${fmt(vsi)}</span>`:""}
    ${tgt?`<div title="Target" style="position:absolute;left:0;right:0;bottom:${tgtY+22}px;border-top:2px dashed var(--green);"></div><span style="position:absolute;left:0;bottom:${tgtY+24}px;font-size:10px;color:var(--green);font-weight:700;">Target \u20B9${fmt(tgt)}</span>`:""}
  </div>`;
  chart.appendChild(cbody);
  grid.appendChild(chart);

  // version timeline (old values remain visible)
  const tl=document.createElement("div"); tl.className="panel";
  tl.innerHTML=`<div class="panel-header"><h3>Version history <span class="count-pill">${versions.length}</span></h3></div>`;
  const tlb=document.createElement("div"); tlb.className="panel-body";
  tlb.innerHTML=`<ul class="timeline">${versions.map((v,i)=>{
    const cur=i===versions.length-1;
    const dv=v.target?((v.price-v.target)/v.target*100):0;
    return `<li class="${cur?'current':'done'}"><div class="tl-dot">${cur?'\u25CF':'\u2713'}</div>
      <div class="tl-body"><div class="tl-title">\u20B9${fmt(v.price)} ${cur?'<span class="chip chip-blue" style="margin-left:6px;"><span class="chip-dot"></span>current</span>':''}
        <span class="chip ${dv>0?'chip-red':'chip-green'}" style="margin-left:6px;"><span class="chip-dot"></span>${dv>=0?'+':''}${dv.toFixed(1)}% vs Target</span></div>
      <div class="tl-meta">Effective ${v.effectiveFrom} \u2022 ${v.source}${v.changeReq?` \u2022 ${Components.wfChip(v.changeReq)}`:""}</div></div></li>`;
  }).join("")}</ul>`;
  tl.appendChild(tlb);
  grid.appendChild(tl);
  wrap.appendChild(grid);
  return wrap;
}

function openPriceDrawer(partNumber){
  const list=DATA.priceVersions[partNumber];
  const last=list[list.length-1];
  Drawer.open("Record price change",
    `<div class="text-muted" style="font-size:12.5px;margin-bottom:12px;">This appends a <b>new version</b> \u2014 the current \u20B9${fmt(last.price)} stays in the history.</div>

     <div class="hint">VSI \u20B9${fmt(last.vsi)} and Target \u20B9${fmt(last.target)} are retained as the variance baseline.</div>`,
    ()=>{

      list.push({price, vsi:last.vsi, target:last.target, effectiveFrom:document.getElementById("pv-eff").value||TODAY,
        source:document.getElementById("pv-src").value||"Manual", changeReq:document.getElementById("pv-cr").value||null});
      Store.audit("Price", "new version", partNumber+" \u20B9"+price);

}
