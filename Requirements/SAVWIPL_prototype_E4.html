function buildImpact(){
  const d=ChangeCtx.get(); const im=d.impact; const m=d.mod;
  const wrap=e4Head("Impact Analysis",
    "Commercial · technical · supply-chain · production impact with cost & savings. An AI panel surfaces similar historical changes and a risk indicator.");

  const canWrite = RBAC.role==="buyer"||RBAC.role==="approver"||RBAC.role==="admin"||RBAC.role==="pm";
  const dTot = m.rows.reduce((a,r)=>a+((r.neu!=null?+r.neu:+r.cur)-(+r.cur)),0);
  const vol = 48000;
  const annual = dTot*vol;

  // cost cards
  const kpis=document.createElement("div"); kpis.className="grid grid-4";
  kpis.appendChild(Components.kpiCard("Piece-price delta", (dTot>0?"+":"")+dTot+" ₹", dTot>0?{dir:"up",text:"increase"}:{dir:"down",text:"saving"}, "₹"));
  kpis.appendChild(Components.kpiCard("Annualised impact", "₹"+(annual/100000).toFixed(2)+" L", null, "📅"));
  kpis.appendChild(Components.kpiCard("Volume basis", vol.toLocaleString()+"/yr", null, "🚗"));
  kpis.appendChild(Components.kpiCard("Risk indicator", im.risk, im.risk==="High"?{dir:"up",text:"attention"}:null, "⚠️"));
  wrap.appendChild(kpis);

  // 4 impact dimensions
  const st=document.createElement("div"); st.className="section-title"; st.textContent="Impact dimensions"; wrap.appendChild(st);
  const ig=document.createElement("div"); ig.className="impact-grid";
  const dims=[["commercial","💰 Commercial"],["technical","🔧 Technical"],["supplyChain","🚚 Supply-chain"],["production","🏭 Production"]];
  dims.forEach(([k,lab])=>{
    const c=document.createElement("div"); c.className="impact-card";
    c.innerHTML=`<h4>${lab}</h4><textarea ${canWrite?"":"disabled"}>${im[k]||""}</textarea>`;
    c.querySelector("textarea").oninput=(e)=>im[k]=e.target.value;
    ig.appendChild(c);
  });
  wrap.appendChild(ig);

  // AI similar-change + risk
  const st2=document.createElement("div"); st2.className="section-title"; st2.textContent="AI insight"; wrap.appendChild(st2);
  const grid=document.createElement("div"); grid.className="grid grid-2";
  const sim=document.createElement("div"); sim.className="panel";
  const histSim=[
    {wf:"AEKO-2025-0088", part:"Wire-Harness-B1", pct:91, note:"Connector re-pin · +₹16/pc · approved in 4 wk"},
    {wf:"AWE-2025-0140",  part:"Harness-Loom-A", pct:78, note:"Capacity change · tooling ₹3.8 L · no line stop"},
    {wf:"AeA-2024-0203",  part:"Cable-Set-D2",   pct:64, note:"Spec update · minor cost-down · low risk"}
  ];
  sim.innerHTML=`<div class="panel-header"><h3>✦ Similar historical changes</h3></div><div class="panel-body">
    ${histSim.map(h=>`<div class="docrow"><div class="di">🔄</div><div class="dn"><b>${h.wf} · ${h.part}</b><div>${h.note}</div></div><span class="chip chip-blue"><span class="chip-dot"></span>${h.pct}% match</span></div>`).join("")}
    <div class="text-muted" style="font-size:11.5px;margin-top:6px;">Based on part family, change type and TUL similarity.</div></div>`;
  const riskP=document.createElement("div"); riskP.className="panel";
  const riskLevel = im.risk;
  const on = riskLevel==="Low"?1:riskLevel==="Medium"?2:3;
  riskP.innerHTML=`<div class="panel-header"><h3>✦ Risk indicator</h3></div><div class="panel-body">
    <div class="risk-meter" style="margin-bottom:12px;"><div class="risk-seg ${on>=1?"on-"+riskLevel.toLowerCase():""}"></div><div class="risk-seg ${on>=2?"on-"+riskLevel.toLowerCase():""}"></div><div class="risk-seg ${on>=3?"on-"+riskLevel.toLowerCase():""}"></div>
      <span style="margin-left:10px;font-weight:800;color:${riskLevel==="High"?"var(--red)":riskLevel==="Medium"?"var(--amber)":"var(--green)"};">${riskLevel}</span></div>
    <div class="kv"><span class="kk">Cost risk</span><span class="vv">${dTot>0?"Elevated — price up":"Contained"}</span></div>
    <div class="kv"><span class="kk">Delay risk</span><span class="vv">${riskLevel==="High"?"Line changeover at 0-Series":"Within milestone buffer"}</span></div>
    <div class="kv"><span class="kk">Supplier risk</span><span class="vv">Single-source · capacity confirmed</span></div>
    <div class="text-muted" style="font-size:11.5px;margin-top:8px;">Forecast blends cost delta, milestone proximity and supplier concentration.</div></div>`;
  grid.appendChild(sim); grid.appendChild(riskP);
  wrap.appendChild(grid);

  const foot=document.createElement("div"); foot.className="panel"; foot.style.marginTop="16px";
  foot.innerHTML=`<div class="panel-body" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
    <button class="btn btn-primary" id="im-next" ${canWrite?"":"disabled style=opacity:.4;"}>Submit to approval workflow →</button></div>`;
  if(canWrite) foot.querySelector("#im-next").onclick=()=>{ advanceStage("Approval"); d.ref.status="Pending"; Toast.show("Submitted to approval workflow.","success"); Router.go("approval-workflow"); };
  wrap.appendChild(foot);
  return wrap;
}

/* =========================================================
   E4.4a — APPROVAL WORKFLOW (6-stage, signatures, versions)
========================================================= */
function buildApproval(){
  const d=ChangeCtx.get();
  const wrap=e4Head("Approval Workflow",
    "Engineering → Quality → SRM → Finance → Commodity → Management. Comments, digital-signature stubs and version control. The AEKO Coordinator confirms; buyer and SRM are notified.");

  const panel=document.createElement("div"); panel.className="panel";
  const approvedN=d.approvals.filter(a=>a.status==="Approved").length;
  panel.innerHTML=`<div class="panel-header"><h3>Approval chain <span class="count-pill">${approvedN}/6 approved</span></h3>
    <span class="chip chip-gray"><span class="chip-dot"></span>Version ${1+d.mod.overwrites.length}.0</span></div><div class="panel-body"><ul class="timeline" id="ap-list"></ul></div>`;
  const list=panel.querySelector("#ap-list");

  function nextPendingIdx(){ return d.approvals.findIndex(a=>a.status!=="Approved"); }
  function render(){
    list.innerHTML="";
    const nextIdx=nextPendingIdx();
    d.approvals.forEach((a,i)=>{
      const done=a.status==="Approved";
      const isCurrent=i===nextIdx && !done;
      const li=document.createElement("li");
      li.className=done?"done":(isCurrent?"current":"");
      const canAct = isCurrent && (RBAC.role==="approver"||RBAC.role==="admin"||RBAC.role==="pm"||RBAC.role==="finance"||RBAC.role==="commodity"||RBAC.role==="srm");
      li.innerHTML=`<div class="tl-dot">${done?"✓":i+1}</div>
        <div class="tl-body" style="flex:1;">
          <div class="tl-title">${a.stage} <span class="text-muted" style="font-weight:500;">· ${a.role}</span> ${done?Components.chip("Approved"):isCurrent?Components.chip("Pending"):`<span class="chip chip-gray"><span class="chip-dot"></span>waiting</span>`}</div>
          <div class="tl-meta">${done?`Signed by ${a.by} on ${a.on} — “${a.comment}”`:isCurrent?"Awaiting decision":"Locked until previous stage clears"}</div>
          ${done?`<div class="sig-box" style="margin-top:8px;display:inline-block;">${a.signature}</div>`:""}
          ${(isCurrent&&canAct)?`<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
             <input id="ap-c-${i}" placeholder="Comment…" style="flex:1;min-width:160px;padding:7px 10px;border:1px solid var(--gray-200);border-radius:8px;font-size:12.5px;">
             <button class="btn btn-primary btn-sm" data-ap="${i}" data-act="approve">✍ Sign &amp; approve</button>
             <button class="btn btn-sm" data-ap="${i}" data-act="reject">Reject</button></div>`:""}
        </div>`;
      list.appendChild(li);
    });
    list.querySelectorAll("[data-ap]").forEach(b=>{
      b.onclick=()=>{ const i=+b.dataset.ap; const a=d.approvals[i];
        const c=document.getElementById("ap-c-"+i); const comment=c?c.value:"";
        if(b.dataset.act==="approve"){
          a.status="Approved"; a.by=DATA.users.find(u=>u.role===RBAC.role)?.name||"Approver"; a.on=TODAY; a.comment=comment||"Reviewed — no objection."; a.signature=a.by.replace(/\./g,"");
          Store.audit("Technical Change", a.stage+" approved", d.ref.wf);
          if(nextPendingIdx()===-1){ Toast.show("All stages approved. Ready for AEKO confirmation.","success"); }
          else Toast.show(a.stage+" approved. Routed to "+d.approvals[nextPendingIdx()].stage+".","success");
        } else {
          a.status="Pending"; d.ref.status="Open"; Store.audit("Technical Change", a.stage+" rejected", d.ref.wf);
          Toast.show(a.stage+" rejected — returned to buyer.","warn");
        }
        render(); renderConfirm();
      };
    });
  }
  render();
  wrap.appendChild(panel);

  // AEKO confirm
  const cf=document.createElement("div"); cf.className="panel"; cf.style.marginTop="16px";
  cf.innerHTML=`<div class="panel-header"><h3>AEKO Coordinator confirmation</h3></div><div class="panel-body" id="ap-confirm"></div>`;
  wrap.appendChild(cf);
  function renderConfirm(){
    const body=cf.querySelector("#ap-confirm");
    const all=d.approvals.every(a=>a.status==="Approved");
    const canConfirm = all && (RBAC.role==="aeko"||RBAC.role==="admin"||RBAC.role==="pm");
    body.innerHTML = `<div class="text-muted" style="font-size:12.5px;margin-bottom:12px;">${all?"All six stages approved. The coordinator confirms final approval; buyer and SRM are notified.":"Confirmation unlocks once all six stages are approved."}</div>
      <button class="btn btn-primary" id="ap-confirm-btn" ${canConfirm?"":"disabled style=opacity:.4;"}>✓ Confirm final approval &amp; notify buyer + SRM</button>`;
    if(canConfirm) body.querySelector("#ap-confirm-btn").onclick=()=>{
      d.ref.status="Approved"; advanceStage("Implementation");
      Store.audit("Technical Change","Final approval confirmed", d.ref.wf);
      Toast.show(`Final approval confirmed. Buyer ${d.assign.buyer} and SRM ${d.assign.srm} notified.`,"success");
      Router.go("implementation");
    };
  }
  renderConfirm();
  return wrap;
}

/* =========================================================
   E4.4b — IMPLEMENTATION & CONTROL
========================================================= */
function buildImplementation(){
  const d=ChangeCtx.get();
  const wrap=e4Head("Implementation & Control",
    "On approval: update price/BOM/PO, notify supplier, release drawing, raise tool order, notify plant/quality/production — monitored to closure.");

  if(d.ref.status!=="Approved" && d.stageIdx<8){
    wrap.appendChild(Components.el(`<div class="coming-soon" style="border-color:var(--amber);"><div class="cs-icon">🔒</div><div class="cs-title">Not yet approved</div><div class="text-muted">Implementation actions unlock after final approval confirmation.</div><button class="btn btn-primary" style="margin-top:14px;" onclick="Router.go('approval-workflow')">Go to approval workflow</button></div>`));
    return wrap;
  }
  const canWrite = RBAC.role==="buyer"||RBAC.role==="srm"||RBAC.role==="admin"||RBAC.role==="pm";
  const doneN=d.implementation.filter(t=>t.done).length;
  const panel=document.createElement("div"); panel.className="panel";
  panel.innerHTML=`<div class="panel-header"><h3>Downstream implementation <span class="count-pill" id="im-count">${doneN}/${d.implementation.length} done</span></h3>
    <button class="btn btn-sm" id="im-all" ${canWrite?"":"disabled"}>Fire all remaining</button></div><div class="panel-body" id="im-list"></div>`;
  const listEl=panel.querySelector("#im-list");
  function render(){
    listEl.innerHTML="";
    d.implementation.forEach((t,i)=>{
      const row=document.createElement("div"); row.className="docrow";
      row.innerHTML=`<div class="di">${t.done?"✅":"⚙️"}</div><div class="dn"><b>${t.task}</b><div>${t.done?"completed "+TODAY:"pending"}</div></div>
        ${t.done?Components.chip("Approved"):`<button class="btn btn-sm" data-im="${i}" ${canWrite?"":"disabled"}>Fire</button>`}`;
      listEl.appendChild(row);
    });
    panel.querySelector("#im-count").textContent=`${d.implementation.filter(t=>t.done).length}/${d.implementation.length} done`;
    listEl.querySelectorAll("[data-im]").forEach(b=>b.onclick=()=>{ const t=d.implementation[+b.dataset.im]; t.done=true; Store.audit("Technical Change","Implementation: "+t.task, d.ref.wf); Toast.show(t.task+" — done.","success"); checkClose(); render(); });
  }
  function checkClose(){ if(d.implementation.every(t=>t.done)){ d.stageIdx=9; d.ref.stage="Closed"; d.ref.status="Approved"; } }
  render();
  if(canWrite) panel.querySelector("#im-all").onclick=()=>{ d.implementation.forEach(t=>t.done=true); Store.audit("Technical Change","All implementation actions fired", d.ref.wf); checkClose(); Toast.show("All actions fired. Change closed.","success"); Router.render(); };
  wrap.appendChild(panel);

  // closure status
  const cl=document.createElement("div"); cl.className="panel"; cl.style.marginTop="16px";
  const closed=d.implementation.every(t=>t.done);
  cl.innerHTML=`<div class="panel-body" style="display:flex;align-items:center;gap:10px;">
    ${closed?`<span class="chip chip-green"><span class="chip-dot"></span>Change closed</span><span class="text-muted" style="font-size:12.5px;">${d.ref.wf} implemented and monitored to closure.</span>`
      :`<span class="chip chip-amber"><span class="chip-dot"></span>In implementation</span><span class="text-muted" style="font-size:12.5px;">Monitoring downstream actions to closure.</span>`}</div>`;
  wrap.appendChild(cl);
  return wrap;
}

/* =========================================================
   E4.4c — CHANGE DASHBOARD (Open/Pending/Approved + cost)
========================================================= */
function buildChangeDashboard(){
  const wrap=document.createElement("div");
  wrap.appendChild(Components.pageHeader("Change Dashboard",
    "Live status board across all technical changes — Open · Pending · Approved, with cost impact and risk. Management view."));

  const open=DATA.changes.filter(c=>c.status==="Open").length;
  const pend=DATA.changes.filter(c=>c.status==="Pending").length;
  const appr=DATA.changes.filter(c=>c.status==="Approved").length;
  function costOf(c){ const m=CD[c.id].mod; return m.rows.reduce((a,r)=>a+((r.neu!=null?+r.neu:+r.cur)-(+r.cur)),0); }
  const totalCost=DATA.changes.reduce((a,c)=>a+costOf(c),0);

  const kpis=document.createElement("div"); kpis.className="grid grid-4";
  kpis.appendChild(Components.kpiCard("Open", open, null, "🟦"));
  kpis.appendChild(Components.kpiCard("Pending", pend, {dir:"up",text:"in approval/eval"}, "🟨"));
  kpis.appendChild(Components.kpiCard("Approved", appr, {dir:"up",text:"implemented / closing"}, "🟩"));
  kpis.appendChild(Components.kpiCard("Net cost impact", (totalCost>0?"+":"")+"₹"+totalCost+"/pc", totalCost>0?{dir:"up",text:"across changes"}:{dir:"down",text:"net saving"}, "₹"));
  wrap.appendChild(kpis);

  // chart + board
  const grid=document.createElement("div"); grid.className="grid grid-2"; grid.style.marginTop="16px";
  grid.appendChild(Components.chartPanel("Changes by stage", STAGES.map(s=>DATA.changes.filter(c=>c.stage===s).length+0.1), "#2E5496"));
  const rp=document.createElement("div"); rp.className="panel";
  rp.innerHTML=`<div class="panel-header"><h3>Type mix</h3></div><div class="panel-body">
    ${["AEKO","AWE","AeA"].map(t=>{const n=DATA.changes.filter(c=>c.type===t).length;return `<div class="kv"><span class="kk">${typeChip(t)}</span><span class="vv">${n} change${n!==1?"s":""}</span></div>`;}).join("")}
    <div class="kv"><span class="kk">Others (Running/MY/Supplier)</span><span class="vv">${DATA.changes.filter(c=>!["AEKO","AWE","AeA"].includes(c.type)).length}</span></div></div>`;
  grid.appendChild(rp);
  wrap.appendChild(grid);

  // status board table
  const st=document.createElement("div"); st.className="section-title"; st.textContent="Status board"; wrap.appendChild(st);
  const rows=DATA.changes.map(c=>({...c, __cost:costOf(c), __risk:CD[c.id].impact.risk}));
  const table=Components.masterTable({
    columns:[
      {key:"wf",label:"Workflow no.",render:r=>Components.wfChip(r.wf)},
      {key:"type",label:"Type",render:r=>typeChip(r.type)},
      {key:"part",label:"Part"},
      {key:"project",label:"Project"},
      {key:"stage",label:"Stage"},
      {key:"status",label:"Status",render:r=>Components.chip(r.status)},
      {key:"__cost",label:"Δ cost/pc",render:r=>`<span class="${r.__cost>0?"delta-pos":r.__cost<0?"delta-neg":""}">${r.__cost>0?"+":""}${r.__cost}</span>`},
      {key:"__risk",label:"Risk",render:r=>Components.chip(r.__risk==="Low"?"Green":r.__risk==="Medium"?"Amber":"Red")},
      {key:"__open",label:"",render:r=>`<button class="btn btn-sm" data-open="${r.id}">Open</button>`}
    ], rows, emptyText:"No changes."
  });
  table.addEventListener("click",e=>{ const b=e.target.closest("[data-open]"); if(b){ ChangeCtx.activeId=b.dataset.open; Router.go(STAGE_SCREEN[CD[b.dataset.open].ref.stage]||"eval-sheet"); } });
  wrap.appendChild(table);
  return wrap;
}

/* =========================================================
   E4.4d — CHANGE HISTORY & AUDIT
========================================================= */
function buildChangeHistory(){
  const wrap=document.createElement("div");
  wrap.appendChild(Components.pageHeader("Change History & Audit",
    "Full audit trail and version history for every workflow number."));

  // seed a few audit entries if empty
  if(DATA.auditLog.filter(a=>a.entity==="Technical Change").length<3){
    [["Created (AEKO)","AEKO-2026-0041"],["AI extraction completed","AEKO-2026-0052"],["Supplier offer locked","AWE-2026-0021"],["Engineering approved","AEKO-2026-0041"],["Final approval confirmed","AWE-2026-0018"]]
      .forEach(([act,wf],i)=>DATA.auditLog.push({id:"seed"+i,when:"2026-07-2"+i+" 10:0"+i,user:DATA.users[i].name,role:DATA.users[i].role,entity:"Technical Change",action:act,ref:wf}));
  }
  const rows=DATA.auditLog.filter(a=>a.entity==="Technical Change");
  const table=Components.masterTable({
    columns:[
      {key:"when",label:"Timestamp"},
      {key:"ref",label:"Workflow no.",render:r=>Components.wfChip(r.ref)},
      {key:"action",label:"Action"},
      {key:"user",label:"User"},
      {key:"role",label:"Role",render:r=>`<span class="chip chip-gray"><span class="chip-dot"></span>${ROLES.find(x=>x.id===r.role)?.label||r.role}</span>`}
    ], rows, emptyText:"No audit entries yet — perform actions in the change screens."
  });
  wrap.appendChild(table);

  // version history for active change
  const st=document.createElement("div"); st.className="section-title"; st.textContent="Version history · "+ChangeCtx.get().ref.wf; wrap.appendChild(st);
  const d=ChangeCtx.get();
  const vp=document.createElement("div"); vp.className="panel";
  const versions=[{v:"1.0",note:"Initial evaluation sheet from AI extraction",on:d.createdOn}].concat(
    d.mod.overwrites.map((o,i)=>({v:(i+2)+".0",note:"MOD prices re-fetched",on:o.on})));
  vp.innerHTML=`<div class="panel-body"><ul class="timeline">${versions.map((v,i)=>`<li class="${i===versions.length-1?"current":"done"}"><div class="tl-dot">${i===versions.length-1?"●":"✓"}</div><div class="tl-body"><div class="tl-title">Version ${v.v}</div><div class="tl-meta">${v.note} · ${v.on}</div></div></li>`).join("")}</ul></div>`;
  wrap.appendChild(vp);
  return wrap;
}

/* =========================================================
   E4.4e — TECHNICAL-CHANGE AI ASSISTANT (status/cost/forecast)
========================================================= */
function buildTcAi(){
  const wrap=document.createElement("div");
  wrap.appendChild(Components.pageHeader("Technical Change · AI Assistant",
    "Ask about change status and cost impact; get delay, cost and supplier-risk forecasts."));

  // forecast cards
  const kpis=document.createElement("div"); kpis.className="grid grid-3";
  kpis.appendChild(Components.kpiCard("Delay-risk forecast", "2 changes", {dir:"up",text:"near milestone"}, "⏱"));
  kpis.appendChild(Components.kpiCard("Cost-risk forecast", "₹1.1 L", {dir:"up",text:"if trends hold"}, "₹"));
  kpis.appendChild(Components.kpiCard("Supplier-risk", "1 single-source", {dir:"up",text:"Wire-Harness-C3"}, "🏭"));
  wrap.appendChild(kpis);

  const st=document.createElement("div"); st.className="section-title"; st.textContent="Chat"; wrap.appendChild(st);
  const chat=document.createElement("div"); chat.className="mini-chat";
  chat.innerHTML=`<div class="mc-body" id="tc-mc"></div>
    <div class="mc-input"><input id="tc-mc-in" placeholder="Ask about status, cost impact, delay or supplier risk…"><button id="tc-mc-send">Send</button></div>`;
  const body=chat.querySelector("#tc-mc");
  function bot(t){ const m=document.createElement("div"); m.className="mc-msg bot"; m.innerHTML=t; body.appendChild(m); body.scrollTop=body.scrollHeight; }
  function usr(t){ const m=document.createElement("div"); m.className="mc-msg user"; m.textContent=t; body.appendChild(m); body.scrollTop=body.scrollHeight; }
  function answer(q){
    const l=q.toLowerCase();
    if(l.includes("status")){ bot(`<b>Change status</b>: ${DATA.changes.filter(c=>c.status==="Open").length} Open · ${DATA.changes.filter(c=>c.status==="Pending").length} Pending · ${DATA.changes.filter(c=>c.status==="Approved").length} Approved. ${ChangeCtx.get().ref.wf} is at stage <b>${ChangeCtx.get().ref.stage}</b>.`); }
    else if(l.includes("cost")||l.includes("impact")){ const m=ChangeCtx.get().mod; const dTot=m.rows.reduce((a,r)=>a+((r.neu!=null?+r.neu:+r.cur)-(+r.cur)),0); bot(`<b>Cost impact</b> for ${ChangeCtx.get().ref.wf}: piece-price delta <b>${dTot>0?"+":""}₹${dTot}</b>. Annualised ≈ <b>₹${((dTot*48000)/100000).toFixed(2)} L</b> at 48k/yr.`); }
    else if(l.includes("delay")){ bot(`<b>Delay-risk forecast</b>: 2 changes sit within 2 weeks of a milestone (0-Series). ${ChangeCtx.get().ref.wf} risk = <b>${ChangeCtx.get().impact.risk}</b>. Recommend expediting drawing release.`); }
    else if(l.includes("supplier")){ bot(`<b>Supplier-risk</b>: Wire-Harness-C3 is single-source (${ChangeCtx.get().ref.supplier}). Capacity confirmed but concentration is high — consider dual-source qualification.`); }
    else { bot(`I can report change status, cost impact, and delay/cost/supplier-risk forecasts. Try "status", "cost impact", "delay risk" or "supplier risk". For cross-module questions use the ✨ global assistant.`); }
  }
  chat.querySelector("#tc-mc-send").onclick=()=>{ const inp=chat.querySelector("#tc-mc-in"); const v=inp.value.trim(); if(!v)return; usr(v); inp.value=""; setTimeout(()=>answer(v),300); };
  chat.querySelector("#tc-mc-in").addEventListener("keydown",e=>{ if(e.key==="Enter") chat.querySelector("#tc-mc-send").click(); });
  wrap.appendChild(chat);
  bot("Hi — I'm the Technical Change assistant. Ask about status, cost impact, or delay / cost / supplier-risk forecasts.");
  return wrap;
}

   REGISTER E4 SCREENS

  "reports-tc": (typeof buildReportsCentre==="function"? buildReportsCentre : undefined)
});

// Re-render if the user is already viewing a techchange screen
if(Router.module==="techchange"){ Router.render(); }

})();
